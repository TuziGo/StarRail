}

/* 背景层次：粉色光晕 + 深色底 + 点阵纹理 */
body::before{content:'';position:fixed;inset:0;z-index:-2;
  background:
   radial-gradient(900px 620px at 78% -10%,rgba(240,68,148,.28),transparent 62%),
   radial-gradient(760px 520px at 6% 108%,rgba(255,122,184,.18),transparent 60%),
   radial-gradient(1100px 760px at 50% 42%,rgba(58,16,38,.60),transparent 72%),
   var(--bg);}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.45;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:44px 44px;}
#app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1}
/* 樱花画布（由 JS 注入，需置底且不挡交互） */
#canvas_sakura{position:fixed;left:0;top:0;pointer-events:none;z-index:0}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:rgba(10,8,13,.55);backdrop-filter:saturate(1.5) blur(10px);
  -webkit-backdrop-filter:saturate(1.5) blur(10px);flex-wrap:wrap;position:relative;z-index:2}
header h1{font-size:17px;font-weight:700;letter-spacing:.5px;
  text-shadow:0 0 18px rgba(240,68,148,.45)}
header .star{color:var(--pink2)}
.logo{width:30px;height:30px;vertical-align:middle;margin-right:6px;flex:0 0 auto;border-radius:9px;filter:drop-shadow(0 0 8px rgba(192,38,211,.65))}
.mode-tabs{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mode-tabs button{border:0;background:transparent;color:var(--tx3);padding:7px 16px;font-size:14px;font-weight:600;transition:.18s}
.mode-tabs button:hover{color:var(--tx)}
.mode-tabs button.on{background:linear-gradient(135deg,var(--pink),#ff6ba8);color:#fff;
  box-shadow:0 0 16px var(--pink-glow)}
.hint{font-size:12px;color:var(--tx3)}
.cs-wrap{flex-basis:100%;position:relative;margin-top:2px}
.cs-inp{width:100%;box-sizing:border-box;padding:8px 12px;border-radius:9px;font-size:12.5px;
  background:rgba(0,0,0,.35);border:1px solid var(--line2);color:var(--tx);outline:none;font-family:inherit;transition:.15s}
.cs-inp:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(253,83,161,.16)}
.cs-inp::placeholder{color:var(--tx4)}
.cs-pop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:9000;max-height:266px;overflow-y:auto;
  overscroll-behavior:contain;background:rgba(14,9,16,.98);border:1px solid rgba(240,68,148,.42);
  border-radius:10px;padding:5px;box-shadow:0 14px 34px rgba(0,0,0,.72)}
.cs-item{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:7px;background:none;border:0;
  color:var(--tx2);font-size:12.5px;cursor:pointer;font-family:inherit;line-height:1.5}
.cs-item:hover,.cs-item.hl{background:rgba(240,68,148,.18);color:#fff}
.cs-item .k{font-family:var(--mono);color:var(--pink2);margin-right:7px}
.cs-item .pg{color:var(--tx4);font-size:10.5px;margin-left:7px}
.cs-empty{padding:10px 12px;color:var(--tx4);font-size:12px}
.cs-hit{animation:csPulse 1.5s ease}
@keyframes csPulse{0%{box-shadow:0 0 0 9px rgba(253,83,161,.36)}100%{box-shadow:0 0 0 0 rgba(253,83,161,0)}}
.acct-btn{margin-left:2px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);
  padding:6px 13px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:.18s}
.acct-btn:hover{border-color:var(--pink);color:#fff;box-shadow:0 0 14px var(--pink-glow)}
.acct-btn.pulse{border-color:var(--pink);color:#fff;animation:acctPulse 1.2s ease-in-out 4}
@keyframes acctPulse{0%,100%{box-shadow:0 0 0 rgba(240,68,148,0)}50%{box-shadow:0 0 20px rgba(240,68,148,.85)}}
.acct-fab{width:46px;height:46px;padding:0;margin-left:auto;margin-right:10px;border-radius:50%;overflow:hidden;flex:none;
  display:flex;align-items:center;justify-content:center;background:#0b0b11;border:1px solid rgba(255,255,255,.16)}
.acct-fab:hover{border-color:var(--pink);box-shadow:0 0 14px var(--pink-glow)}
.acct-fab.on{background:#0b0b11);border-color:rgba(255,95,162,.55)}
#acctFabImg{width:100%;height:100%;object-fit:cover;display:none}
#acctFabTxt{font-size:10px;color:#8d8d99;font-weight:600;letter-spacing:-.2px}
.acct-fab.on #acctFabTxt{color:#fff;font-size:15px;font-weight:700}
.acct-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.acct-ava{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.ava-circle{width:55px;height:55px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:#101017;border:1px solid rgba(255,255,255,.14);flex:none}
.ava-circle.on{border-color:rgba(255,95,162,.55);box-shadow:0 0 12px var(--pink-glow)}
.ava-circle img{width:100%;height:100%;object-fit:cover;display:block}
.ava-circle span{font-size:12px;color:#7d7d89;font-weight:600}
.ava-circle .av-fb{font-size:20px;color:#cfcfd8;font-weight:700}
.ava-btn{padding:0;background:none;border:0;color:var(--pink);font-size:12px;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px}
#avSheet{position:fixed;inset:0;z-index:9999;background:rgba(6,6,10,.95);display:none;flex-direction:column}
#avSheet.on{display:flex}
.av-sh-top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);flex:none}
.av-sh-top b{font-size:14px;color:#fff;flex:none}
#avSearch{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;padding:7px 10px;color:var(--tx);font-size:12.5px;outline:none}
.av-sh-x{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);color:#ccc;font-size:16px;line-height:1;cursor:pointer}
.av-grid{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px 8px}
.av-cell{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.av-cell img,.av-ph{width:54px;height:54px;border-radius:50%;object-fit:cover;display:block;background:#17171f;
  border:2px solid transparent}
.av-cell.on img,.av-cell.on .av-ph{border-color:var(--pink);box-shadow:0 0 10px var(--pink-glow)}
.av-ph{display:flex;align-items:center;justify-content:center;color:#c9c9d4;font-size:17px;font-weight:700}
.av-cell i{font-size:10px;color:var(--tx3);font-style:normal;max-width:62px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#acctMask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9997;display:none}
#acctMask.on{display:block}
#acctMenu{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9998;display:none;
  flex-direction:column;gap:9px;padding:18px;width:min(320px,86vw);
  background:#17121b;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.65)}
#acctMenu.on{display:flex}
#acctManage{display:none}
.acct-item.ghost{padding:7px;border-color:transparent;background:transparent;color:var(--tx3);font-size:12px;font-weight:400}
.acct-item.ghost:hover{color:var(--pink)}
.acct-title{font-size:20px;font-weight:700;color:var(--tx)}
.acct-sub{font-size:12px;color:var(--tx3);margin-bottom:2px;line-height:1.5}
.acct-item{display:block;width:100%;text-align:center;padding:11px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);font-size:14px;font-weight:600;cursor:pointer}
.acct-item.primary{background:linear-gradient(135deg,var(--pink),#ff6ba8);border-color:transparent;color:#fff;
  box-shadow:0 0 16px var(--pink-glow)}
#body{display:flex;flex:1;min-height:0;position:relative;z-index:1}
nav{width:200px;flex-shrink:0;border-right:1px solid var(--line);
  background:rgba(8,6,11,.26);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  overflow-y:auto;padding:10px 8px}
nav button{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;background:transparent;
  color:var(--tx3);padding:9px 12px;border-radius:9px;font-size:14px;text-align:left;margin-bottom:2px;
  transition:.18s cubic-bezier(.2,.7,.3,1)}
nav button:hover{background:var(--pink-soft);color:#fff;transform:translateX(3px)}
nav button.on{background:linear-gradient(90deg,rgba(240,68,148,.30),rgba(240,68,148,.08));
  color:#ffd6e8;font-weight:600;border-color:rgba(240,68,148,.32);
  box-shadow:0 2px 14px rgba(240,68,148,.22)}
nav .grp{font-size:11px;color:var(--tx4);padding:10px 12px 4px;letter-spacing:1px}
main{flex:1;overflow-y:auto;padding:18px 22px 60px}
@media(max-width:760px){
  #body{flex-direction:column}
  nav{width:100%;display:flex;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
  nav .grp{display:none}
  nav button{width:auto;flex-shrink:0;white-space:nowrap}
  nav button:hover{transform:none}
  main{padding:14px 12px 80px}
}
.panel{max-width:860px;margin:0 auto}
.ptitle{font-size:20px;font-weight:700;margin-bottom:4px;
  background:linear-gradient(100deg,#fff,var(--pink2));-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.pdesc{color:var(--tx3);font-size:13px;margin-bottom:16px}
/* 毛玻璃卡片 + 悬浮上浮粉光（同参考站） */
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;
  backdrop-filter:saturate(1.5) blur(6px);-webkit-backdrop-filter:saturate(1.5) blur(6px);
  box-shadow:0 6px 24px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.05);
  transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s,border-color .22s}
.card:hover{transform:translateY(-5px);border-color:rgba(240,68,148,.36);
  box-shadow:0 8px 26px var(--pink-glow),inset 0 1px 0 rgba(255,255,255,.08)}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--pink2);
  text-shadow:0 0 14px rgba(240,68,148,.35)}
.preview{background:rgba(0,0,0,.34);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  margin-bottom:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.preview .ph{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;
  border-bottom:1px solid var(--line2);font-size:12px;color:var(--tx3)}
.preview .pv{padding:12px 14px;font-family:var(--mono);font-size:15px;color:var(--pink2);
  word-break:break-all;min-height:22px;text-shadow:0 0 16px rgba(240,68,148,.45);
  white-space:pre-wrap;outline:none;border-radius:0;transition:.18s}
.preview .pv:focus{background:rgba(240,68,148,.08);box-shadow:inset 0 0 0 1px rgba(240,68,148,.45)}
.preview .pv:empty::before{content:attr(data-ph);color:var(--tx4,#8a8a8a);font-family:inherit;text-shadow:none;font-size:13px;opacity:.7}
.preview .pv-hint{font-style:normal;font-size:10.5px;color:var(--pink2);opacity:.75;border:1px solid rgba(240,68,148,.45);border-radius:5px;padding:1px 5px;margin-left:6px}
.btn{border:0;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;
  background:linear-gradient(135deg,var(--pink),#ff6ba8);color:#fff;transition:.18s;
  box-shadow:0 2px 10px rgba(240,68,148,.28)}
.btn:hover{filter:brightness(1.12);box-shadow:0 4px 18px var(--pink-glow)}
.btn.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--tx2);box-shadow:none}
.btn.ghost:hover{border-color:var(--pink);color:#fff}
.btn.send-yuki{background:rgba(240,68,148,.12);border:1px solid var(--pink);color:var(--pink2);box-shadow:none}
.btn.send-yuki:hover{background:rgba(240,68,148,.28);color:#fff}
.btn.ok{background:linear-gradient(135deg,#34d399,#10b981);color:#04241a}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-bottom:12px}
.row>.lbl{width:96px;flex-shrink:0;padding-top:9px;font-size:13px;color:var(--tx3)}
.row>.fld{flex:1;min-width:180px}
.fld input[type=text],.fld input[type=number],.fld select{
  width:100%;background:rgba(0,0,0,.34);border:1px solid var(--line2);border-radius:9px;
  color:var(--tx);padding:9px 11px;font-size:14px;outline:none;transition:.18s}
.fld input:hover,.fld select:hover{border-color:rgba(240,68,148,.30)}
.fld input:focus,.fld select:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(253,83,161,.18)}
.gm-rep{outline:none}
.gm-rep:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(253,83,161,.18)}
.fld .note{font-size:11px;color:var(--tx4);margin-top:4px}
/* 钳制反馈：越界被拉回时粉色脉冲 */
@keyframes clampFlash{0%{box-shadow:0 0 0 0 rgba(240,68,148,.60)}100%{box-shadow:0 0 0 9px rgba(240,68,148,0)}}
.fld input.clamped{animation:clampFlash .42s ease-out;border-color:var(--pink)!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
/* search select */
.ss{position:relative}
.ss .cur{width:100%;background:rgba(0,0,0,.34);border:1px solid var(--line2);border-radius:9px;
  color:var(--tx);padding:9px 11px;font-size:14px;outline:none;text-align:left;transition:.18s}
.ss .cur:hover{border-color:var(--pink)}
.ss .cur.ph{color:var(--tx4)}
.ss .pop{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);
  background:rgba(14,11,17,.82);backdrop-filter:saturate(1.8) blur(10px);
  -webkit-backdrop-filter:saturate(1.8) blur(10px);
  border:1px solid var(--line);border-radius:10px;max-height:280px;overflow-y:auto;display:none;
  box-shadow:0 14px 34px rgba(0,0,0,.55)}
.ss .pop input{width:100%;border:0;border-bottom:1px solid var(--line2);background:transparent;
  color:var(--tx);padding:9px 11px;font-size:14px;outline:none;position:sticky;top:0;
  background:rgba(18,14,20,.96)}
.ss .pop .it{padding:8px 12px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.ss .pop .it:hover,.ss .pop .it.hl{background:var(--pink-soft);color:#fff}
.ss .pop .it .id{color:var(--tx4);font-family:var(--mono);font-size:12px}
.ss .pop .empty{padding:12px;color:var(--tx4);font-size:13px;text-align:center}
/* preset cards */
.plist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.plist{grid-template-columns:1fr}}
.pitem{background:rgba(0,0,0,.34);border:1px solid var(--line2);border-radius:11px;padding:11px 13px;
  transition:.18s cubic-bezier(.2,.7,.3,1)}
.pitem:hover{border-color:var(--pink);transform:translateY(-3px);
  box-shadow:0 8px 20px var(--pink-glow)}
.pitem .t{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.pitem .tag{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:600}
.tag.character{background:rgba(240,68,148,.18);color:#ffa8cf}
.tag.item{background:rgba(52,211,153,.15);color:#6ee7b7}
.tag.system{background:rgba(251,191,36,.15);color:#fcd34d}
.pitem .v{font-family:var(--mono);font-size:12px;color:var(--pink2);word-break:break-all}
.pitem .d{font-size:12px;color:var(--tx3);margin-top:5px}
.pitem .pd{font-size:11px;color:var(--tx4);margin-top:5px;line-height:1.6}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--tx3);
  border-radius:99px;padding:6px 14px;font-size:13px;transition:.18s}
.tabs button:hover{border-color:var(--pink);color:#fff}
.tabs button.on{background:linear-gradient(135deg,var(--pink),#ff6ba8);border-color:transparent;
  color:#fff;font-weight:600;box-shadow:0 2px 12px var(--pink-glow)}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.kv span{font-size:12px;color:var(--tx3);background:var(--pink-soft);border:1px solid var(--line);
  padding:3px 9px;border-radius:7px}
.subcheck{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.subcheck select{width:130px}
.subcheck input{width:70px}
.subcheck button{border:0;background:transparent;color:var(--red);font-size:16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,var(--pink),#ff6ba8);color:#fff;padding:9px 18px;border-radius:10px;
  font-size:13.5px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:99;
  box-shadow:0 6px 22px var(--pink-glow)}
.toast.show{opacity:1;transform:translateX(-50%)}
.sect{font-size:12px;color:var(--tx4);margin:14px 0 8px;letter-spacing:1px}

/* 鼠标跟随环（hotpink，同参考站） */
.mouse-cursor{position:fixed;left:0;top:0;pointer-events:none;z-index:10000000;visibility:hidden}
.cursor-inner,.cursor-outer{position:absolute;top:0;left:0;border-radius:50%}
.cursor-inner{margin-left:-3px;margin-top:-3px;width:6px;height:6px;background:hotpink;
  transition:width .3s ease-in-out,height .3s ease-in-out,margin .3s ease-in-out,opacity .3s ease-in-out}
.cursor-inner.cursor-hover{margin-left:-18px;margin-top:-18px;width:36px;height:36px;
  background:hotpink;opacity:.30}
.cursor-outer{margin-left:-15px;margin-top:-15px;width:30px;height:30px;border:2px solid hotpink;
  box-sizing:border-box;opacity:.50;transition:opacity .08s ease-out}
.cursor-outer.cursor-hover{opacity:0}
/* 粉黑滚动条 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--pink),#ff6ba8);border-radius:99px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:99px}
/* 窄屏降级：减少毛玻璃开销、隐藏跟随环 */
@media(max-width:760px){
  .card,.preview{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .ss .pop{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .card:hover{transform:none}
  .mouse-cursor{display:none}
}
@media (hover:none){.mouse-cursor{display:none}}


/* ===== 顶部常驻广告条 ===== */
.topad{display:flex;align-items:center;justify-content:center;gap:10px;flex-shrink:0;
  padding:7px 14px;font-size:13px;font-weight:600;color:#fff;text-decoration:none;
  background:linear-gradient(90deg,#f04494 0%,#ff6ba8 42%,#ffa94d 100%);
  position:relative;z-index:3;white-space:nowrap;overflow:hidden;
  box-shadow:0 2px 18px rgba(240,68,148,.38);transition:filter .2s,box-shadow .2s}
.topad::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 32%,rgba(255,255,255,.34) 48%,transparent 64%);
  transform:translateX(-130%);animation:adshine 3.8s ease-in-out infinite}
@keyframes adshine{0%{transform:translateX(-130%)}55%{transform:translateX(130%)}100%{transform:translateX(130%)}}
.topad:hover{filter:brightness(1.08);box-shadow:0 4px 26px rgba(240,68,148,.55)}
.topad .tad-tag{flex-shrink:0;font-size:10px;letter-spacing:1.2px;background:rgba(0,0,0,.30);
  padding:2px 7px;border-radius:5px}
.topad .tad-txt{overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
.topad .tad-url{flex-shrink:0;position:relative;z-index:1;font-family:var(--mono);font-size:12px;
  background:rgba(0,0,0,.24);padding:2px 10px;border-radius:99px}
.topad .arrow{display:inline-block;animation:adarrow 1.1s ease-in-out infinite}
@keyframes adarrow{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
@media(max-width:560px){
  .topad{font-size:11.5px;padding:6px 10px;gap:7px}
  .topad .tad-txt{max-width:42vw}
  .topad .tad-url{font-size:10.5px;padding:2px 7px}
}
/* ===== 首页推广卡 ===== */
.promobox{position:relative;border-radius:14px;padding:16px 18px;margin-bottom:14px;overflow:hidden;
  background:linear-gradient(135deg,rgba(240,68,148,.18),rgba(255,107,168,.06) 58%,rgba(251,191,36,.12));
  border:1px solid rgba(240,68,148,.40);
  box-shadow:0 6px 26px rgba(240,68,148,.18),inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:saturate(1.5) blur(6px);-webkit-backdrop-filter:saturate(1.5) blur(6px)}
.promobox::after{content:'';position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(240,68,148,.30),transparent 70%);pointer-events:none}
.pb-head{position:relative;z-index:1;display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;
  color:#fff;margin-bottom:7px;text-shadow:0 0 16px rgba(240,68,148,.45)}
.pb-badge{font-size:10px;font-weight:700;letter-spacing:1.2px;color:#fff;padding:2px 8px;border-radius:99px;
  background:linear-gradient(135deg,var(--pink),#ff6ba8);box-shadow:0 0 12px var(--pink-glow)}
.pb-body{position:relative;z-index:1;font-size:13px;color:var(--tx2);line-height:1.75;margin-bottom:12px}
.pb-body b{color:#ffd6e8}
.pb-cta{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  background:linear-gradient(135deg,var(--pink),#ff6ba8);color:#fff;font-weight:700;font-size:13.5px;
  padding:9px 20px;border-radius:99px;box-shadow:0 4px 18px var(--pink-glow);transition:.2s}
.pb-cta:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 6px 26px var(--pink-glow)}
.pb-note{position:relative;z-index:1;font-size:11.5px;color:#ffffff;margin-top:11px;line-height:1.6}
/* ===== 首页布局 ===== */
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.hcard{background:rgba(10,8,13,.46);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  backdrop-filter:saturate(1.5) blur(6px);-webkit-backdrop-filter:saturate(1.5) blur(6px);
  box-shadow:0 6px 22px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.05);
  transition:transform .22s cubic-bezier(.2,.7,.3,1),border-color .22s,box-shadow .22s}
.hcard:hover{transform:translateY(-3px);border-color:rgba(240,68,148,.36);box-shadow:0 8px 24px var(--pink-glow)}
.hc-t{font-size:14px;font-weight:600;color:var(--pink2);margin-bottom:6px;
  text-shadow:0 0 14px rgba(240,68,148,.35)}
.hc-d{font-size:12.5px;color:var(--tx2);line-height:1.75}
.hc-n{font-size:11px;color:var(--tx4);margin-top:6px;letter-spacing:.5px}
.note-lite{background:rgba(255,255,255,.03);border:1px solid var(--line2);border-left:3px solid rgba(240,68,148,.45);
  border-radius:10px;padding:12px 15px;color:var(--tx3);font-size:12.5px;line-height:1.75}
.note-lite b{color:#ffd6e8}
.hsteps{list-style:none;counter-reset:s;margin:0}
.hsteps li{counter-increment:s;position:relative;padding-left:26px;font-size:13px;color:var(--tx2);
  line-height:1.9}
.hsteps li::before{content:counter(s);position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;
  background:rgba(240,68,148,.18);border:1px solid rgba(240,68,148,.4);color:var(--pink2);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
@media(max-width:560px){.hgrid{grid-template-columns:1fr}}




/* ===== 背景轮播（角色立绘，A 羽化 + B 模糊底衬） ===== */
#bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:#0b0a0d}
.bg-slide{position:absolute;inset:0;z-index:1;opacity:0;
  transition:opacity 1.6s ease-in-out;will-change:opacity}
.bg-slide.on{opacity:1;animation:kenburns 12s ease-out forwards}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.03)}}


/* B：模糊底衬——同图放大铺满全屏，负责整屏氛围与取色 */
.bg-slide .bb{position:absolute;inset:0;z-index:1;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  filter:blur(45px) brightness(.34) saturate(1.2);
  transform:scale(1.18);transform-origin:center}


/* A：清晰立绘——右侧锚定，左缘 + 上下缘羽化融入底衬 */
.bg-slide .bs{position:absolute;inset:0;z-index:2;
  background-size:auto 100%;background-position:right center;background-repeat:no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,0) 3%,#000 22%,#000 100%),
    linear-gradient(180deg,transparent 0%,#000 7%,#000 93%,transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,0) 3%,#000 22%,#000 100%),
    linear-gradient(180deg,transparent 0%,#000 7%,#000 93%,transparent 100%);
  mask-composite:intersect}
/* PC 横版壁纸：全屏铺满，不需要模糊底衬与羽化 */
#bg.landscape .bb{display:none}
#bg.landscape .bs{background-size:cover;background-position:center;
  -webkit-mask-image:none;mask-image:none}
#bg.landscape .bg-shade{background:
  linear-gradient(90deg, rgba(10,10,12,.80) 0%, rgba(10,10,12,.58) 34%, rgba(10,10,12,.20) 72%, rgba(10,10,12,.10) 100%),
  radial-gradient(120% 110% at 4% 50%, rgba(240,68,148,.18), transparent 58%),
  linear-gradient(180deg, rgba(10,10,12,.46), transparent 18%, transparent 82%, rgba(10,10,12,.54));}
.bg-shade{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    linear-gradient(90deg, rgba(10,10,12,.95) 0%, rgba(10,10,12,.82) 30%, rgba(10,10,12,.30) 60%, rgba(10,10,12,.08) 100%),
    radial-gradient(130% 120% at 2% 50%, rgba(240,68,148,.20), transparent 55%),
    linear-gradient(180deg, rgba(10,10,12,.55), transparent 15%, transparent 85%, rgba(10,10,12,.62));}
.bg-dots{position:fixed;right:20px;bottom:18px;z-index:6;display:flex;gap:9px;pointer-events:auto}
.bg-dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.28);
  border:1px solid rgba(240,68,148,.45);cursor:pointer;transition:.35s;}
.bg-dots i:hover{background:rgba(240,68,148,.5)}
.bg-dots i.on{width:28px;border-radius:5px;background:linear-gradient(90deg,var(--pink),#ff6ba8);
  box-shadow:0 0 12px var(--pink-glow)}
@media (max-width:760px){
  .bg-slide .bs{background-size:cover;background-position:center;
    -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 10%,#000 90%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0%,#000 10%,#000 90%,transparent 100%);
    -webkit-mask-composite:source-over;mask-composite:add}
  .bg-shade{background:
    linear-gradient(180deg, rgba(10,10,12,.58), rgba(10,10,12,.42) 26%, rgba(10,10,12,.42) 62%, rgba(10,10,12,.66) 100%),
    radial-gradient(120% 80% at 50% 4%, rgba(240,68,148,.14), transparent 55%);}
  .bg-dots{right:50%;transform:translateX(50%);bottom:10px}
}
@media (prefers-reduced-motion:reduce){
  .bg-slide{transition:opacity .9s ease-in-out}
  .bg-slide.on{animation:none}
  .bg-slide .bb{transform:scale(1.05)}
}


/* ===== CYBER POPUP (unified) ===== */
/* ==========================================================================
   赛博朋克跑马灯弹窗（三站统一版）
   蓝粉双色描边流光 + 扫描线 + 网格底纹
   ========================================================================== */


#adMask.admask{
  position:fixed;inset:0;z-index:9000;
  display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(4,5,10,.62);
  backdrop-filter:blur(8px) saturate(1.25);
  -webkit-backdrop-filter:blur(8px) saturate(1.25);
  opacity:1;transition:opacity .24s ease;
}
#adMask.admask[hidden]{display:none}
#adMask.admask.out{opacity:0}


/* ---------- 外框：跑马灯 ---------- */
#adMask .adbox{
  position:relative;
  width:100%;max-width:420px;
  border-radius:18px;
  padding:26px 24px 22px;
  background:
    linear-gradient(165deg,rgba(22,18,34,.97) 0%,rgba(12,10,20,.99) 55%,rgba(16,12,26,.99) 100%);
  box-shadow:
    0 28px 80px rgba(0,0,0,.70),
    0 0 0 1px rgba(255,255,255,.045) inset,
    0 0 52px rgba(88,120,255,.16);
  animation:adpop .38s cubic-bezier(.2,.9,.3,1.08);
  isolation:isolate;
  overflow:hidden;
}


/* 双色流动描边：conic 渐变绕圈 + 遮罩只留 2px 边框 */
#adMask .adbox::before{
  content:'';
  position:absolute;inset:-2px;z-index:-1;
  border-radius:20px;
  background:conic-gradient(
    from 0deg,
    #4de3ff 0deg,
    #7b8cff 60deg,
    #ff4db8 130deg,
    #b44dff 200deg,
    #4de3ff 290deg,
    #ff4db8 340deg,
    #4de3ff 360deg
  );
  animation:adspin 4.2s linear infinite;
}
/* 内侧压暗，形成“描边”效果 */
#adMask .adbox::after{
  content:'';
  position:absolute;inset:2px;z-index:-1;
  border-radius:16px;
  background:linear-gradient(165deg,rgba(22,18,34,.98),rgba(12,10,20,1));
}
@keyframes adspin{to{transform:rotate(360deg)}}


/* 扫描线（赛博质感） */
#adMask .ad-scan{
  position:absolute;inset:0;pointer-events:none;z-index:1;
  border-radius:18px;overflow:hidden;opacity:.55;
}
#adMask .ad-scan::before{
  content:'';position:absolute;left:0;right:0;height:46%;
  background:linear-gradient(180deg,transparent,rgba(77,227,255,.10),transparent);
  animation:adscan 3.4s ease-in-out infinite;
}
@keyframes adscan{
  0%{top:-50%}
  55%{top:100%}
  100%{top:100%}
}


/* 网格底纹 */
#adMask .ad-grid{
  position:absolute;inset:0;pointer-events:none;z-index:0;
  border-radius:18px;opacity:.16;
  background-image:
    linear-gradient(rgba(77,227,255,.30) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,77,184,.24) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(120% 100% at 50% 0%,#000 20%,transparent 78%);
  -webkit-mask-image:radial-gradient(120% 100% at 50% 0%,#000 20%,transparent 78%);
}


/* 内容层提到最上 */
#adMask .adbox > *:not(.ad-scan):not(.ad-grid){position:relative;z-index:2}


/* ---------- 关闭按钮（右上角） ---------- */
#adMask .ad-close{
  position:absolute !important;
  right:12px !important;
  left:auto !important;
  top:12px !important;
  z-index:20;
  width:28px;height:28px;border-radius:50%;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(140,180,255,.22);
  color:#a9b8d6;font-size:16px;line-height:1;transition:.18s;
}
#adMask .ad-close:hover{
  background:rgba(255,77,184,.22);
  border-color:rgba(255,77,184,.60);
  color:#fff;
  box-shadow:0 0 16px rgba(255,77,184,.45);
}


/* ---------- 徽标 ---------- */
#adMask .ad-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:9.5px;font-weight:800;letter-spacing:1.8px;color:#eaf6ff;
  padding:3px 10px;border-radius:5px;margin-bottom:12px;
  background:linear-gradient(135deg,rgba(77,227,255,.28),rgba(255,77,184,.28));
  border:1px solid rgba(120,220,255,.42);
  box-shadow:0 0 16px rgba(77,227,255,.28);
  text-shadow:0 0 8px rgba(77,227,255,.65);
}
#adMask .ad-badge::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:#4de3ff;box-shadow:0 0 8px #4de3ff;
  animation:adblink 1.5s ease-in-out infinite;
}
@keyframes adblink{0%,100%{opacity:1}50%{opacity:.25}}


/* ---------- 文字 ---------- */
#adMask .ad-title{
  font-size:18px;font-weight:800;color:#fff;letter-spacing:.4px;
  margin-bottom:9px;line-height:1.35;
  text-shadow:0 0 18px rgba(120,190,255,.45),0 0 34px rgba(255,77,184,.22);
}
#adMask .ad-desc{
  font-size:12.8px;color:#c8d4e6;line-height:1.78;
  margin-bottom:15px;
}
#adMask .ad-desc b{
  color:#7de7ff;font-weight:700;
  text-shadow:0 0 12px rgba(77,227,255,.55);
}
#adMask .ad-desc .ad-hl{
  color:#ff9ede;font-weight:700;
  text-shadow:0 0 12px rgba(255,77,184,.55);
}
#adMask .ad-games{
  display:inline-block;
  color:#e8f4ff;
  font-weight:700;
  letter-spacing:.2px;
  line-height:1.7;
  text-shadow:0 0 14px rgba(120,200,255,.42);
}




/* ---------- 网址/短链条 ---------- */
#adMask .ad-url{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Consolas','JetBrains Mono',monospace;
  font-size:13px;letter-spacing:.6px;
  color:#9fe7ff;
  padding:10px 14px;border-radius:10px;margin-bottom:16px;
  background:linear-gradient(90deg,rgba(77,227,255,.08),rgba(255,77,184,.08));
  border:1px dashed rgba(120,200,255,.38);
  text-shadow:0 0 10px rgba(77,227,255,.5);
}
#adMask .ad-url::before{content:'▸';color:#4de3ff;opacity:.8}
#adMask .ad-url::after{content:'◂';color:#ff4db8;opacity:.8}


/* ---------- 按钮 ---------- */
#adMask .ad-btns{display:flex;gap:10px}
#adMask .ad-go{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  text-decoration:none;cursor:pointer;
  padding:11px 0;border-radius:99px;border:0;
  font-size:13.5px;font-weight:800;color:#0a0a12;letter-spacing:.5px;
  background:linear-gradient(135deg,#4de3ff 0%,#7b8cff 45%,#ff4db8 100%);
  background-size:200% 100%;
  box-shadow:0 6px 26px rgba(88,150,255,.42),0 0 22px rgba(255,77,184,.26);
  transition:.22s;
  animation:adgoflow 5s linear infinite;
}
@keyframes adgoflow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
#adMask .ad-go:hover{transform:translateY(-1px);filter:brightness(1.08)}


#adMask .ad-no,
#adMask .ad-skip,
#adMask .ad-later{
  flex:0 0 96px;
  display:inline-flex;align-items:center;justify-content:center;
  padding:11px 0;border-radius:99px;cursor:pointer;
  font-size:13px;font-weight:600;
  color:#9aa8c0;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(150,175,220,.20);
  transition:.18s;
}
#adMask .ad-no:hover,
#adMask .ad-skip:hover,
#adMask .ad-later:hover{
  color:#e8f2ff;
  background:rgba(120,160,255,.14);
  border-color:rgba(140,190,255,.45);
}


@keyframes adpop{
  from{opacity:0;transform:translateY(14px) scale(.965)}
  to{opacity:1;transform:none}
}


/* ---------- 移动端 ---------- */
@media(max-width:680px){
  #adMask .adbox{max-width:100%;padding:24px 18px 18px;border-radius:16px}
  #adMask .ad-title{font-size:16px}
  #adMask .ad-desc{font-size:12.2px}
  #adMask .ad-no, #adMask .ad-skip, #adMask .ad-later{flex:0 0 84px}
}


/* ---------- 减少动效 ---------- */
@media (prefers-reduced-motion:reduce){
  #adMask .adbox::before{animation:none}
  #adMask .ad-scan::before{animation:none;opacity:.3}
  #adMask .ad-go{animation:none}
  #adMask .ad-badge::before{animation:none}
}




/* ===== 遗器选择器（光锥式排版） ===== */
.rp-wrap{border:1px solid var(--line2);border-radius:12px;background:rgba(0,0,0,.18);padding:12px 10px}
.rp-row{display:block;margin-bottom:12px}
.rp-inline{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rp-lbl{display:block;font-size:12.5px;color:var(--tx3);margin-bottom:7px}
.rp-inline .rp-lbl{margin-bottom:0;flex:0 0 44px}
.rp-btns{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.rp-f{padding:5px 10px;border-radius:8px;font-size:12px;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--tx3);transition:.15s}
.rp-f:hover{background:rgba(240,68,148,.15);color:#fff}
.rp-f.on{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 0 12px var(--pink-glow)}
.rp-q{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);
  background:rgba(0,0,0,.35);color:var(--tx);font-size:13px;outline:none}
.rp-q:focus{border-color:var(--pink);box-shadow:0 0 0 2px rgba(240,68,148,.18)}
.rp-count{font-size:12px;color:var(--tx4);padding:2px 2px 9px}
.rp-list{max-height:272px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.rp-list::-webkit-scrollbar{width:7px}
.rp-list::-webkit-scrollbar-thumb{background:rgba(240,68,148,.35);border-radius:6px}
.rp-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);transition:.15s}
.rp-item:hover{background:rgba(240,68,148,.10);border-color:rgba(240,68,148,.35)}
.rp-item.sel{background:rgba(240,68,148,.18);border-color:rgba(240,68,148,.62)}
.rp-img{width:46px;height:46px;border-radius:9px;object-fit:cover;flex:none;
  background:rgba(0,0,0,.3);border:1px solid var(--line2);display:block}

/* ============================================================
   UI 组件：弹窗 + 抽屉
   ============================================================ */
.ui-mask{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(3,2,6,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;transition:opacity .2s ease}
.ui-mask.in{opacity:1}


.ui-modal{width:100%;max-width:400px;border-radius:16px;overflow:hidden;
  background:linear-gradient(165deg,rgba(26,20,38,.98) 0%,rgba(14,11,22,.99) 60%);
  border:1px solid rgba(240,68,148,.34);
  box-shadow:0 24px 60px rgba(0,0,0,.72), 0 0 0 1px rgba(255,255,255,.04) inset,
             0 0 40px rgba(240,68,148,.12);
  transform:translateY(12px) scale(.97);opacity:0;
  transition:transform .26s cubic-bezier(.2,.9,.3,1.1), opacity .2s ease}
.ui-mask.in .ui-modal{transform:none;opacity:1}


.ui-modal-head{padding:18px 20px 0}
.ui-modal-title{font-size:15px;font-weight:700;color:var(--tx);letter-spacing:.2px}
.ui-modal-sub{font-size:11.5px;color:var(--tx4);margin-top:5px;line-height:1.5}
.ui-modal-body{padding:14px 20px 4px}
.ui-modal-text{font-size:13px;color:var(--tx2);line-height:1.7}


.ui-input{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:10px;
  background:rgba(0,0,0,.42);border:1px solid var(--line2);color:var(--tx);
  font-size:14px;font-family:var(--mono);outline:none;transition:.16s}
.ui-input::placeholder{color:var(--tx4);font-family:inherit;font-size:13px}
.ui-input:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft);
  background:rgba(0,0,0,.55)}
.ui-err{min-height:16px;font-size:11.5px;color:#ff7a7a;padding:5px 2px 0}


.ui-modal-foot{display:flex;gap:9px;padding:10px 20px 18px}
.ui-btn{flex:1;padding:10px 0;border-radius:10px;font-size:13px;font-weight:600;
  cursor:pointer;transition:.16s;border:1px solid transparent}
.ui-btn.primary{background:linear-gradient(135deg,var(--pink),#ff6ba8);color:#fff;
  box-shadow:0 4px 16px rgba(240,68,148,.30)}
.ui-btn.primary:hover{filter:brightness(1.10);box-shadow:0 6px 22px rgba(240,68,148,.42)}
.ui-btn.primary:active{transform:scale(.97)}
.ui-btn.ghost{background:rgba(255,255,255,.06);border-color:var(--line2);color:var(--tx3)}
.ui-btn.ghost:hover{background:rgba(255,255,255,.11);color:var(--tx)}


/* ---------- 底部抽屉 ---------- */
.ui-dmask{position:fixed;inset:0;z-index:100000;background:rgba(3,2,6,.86);
  backdrop-filter:blur(10px) saturate(.7);-webkit-backdrop-filter:blur(10px) saturate(.7);
  opacity:0;transition:opacity .22s ease}
.ui-dmask.in{opacity:1}
.ui-sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow-y:auto;box-sizing:border-box;
  border-radius:18px 18px 0 0;
  background:#100c18;
  background-image:linear-gradient(180deg,#191325 0%,#0f0b16 45%,#0a0810 100%);
  border-top:1px solid rgba(240,68,148,.52);
  box-shadow:0 -16px 50px rgba(0,0,0,.85), 0 -1px 0 rgba(255,255,255,.05) inset;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1.05)}
.ui-dmask.in .ui-sheet{transform:none}
.ui-sheet::before{content:'';display:block;width:38px;height:4px;border-radius:3px;
  background:rgba(255,255,255,.22);margin:4px auto 12px}




/* ---------- 抽屉内容 ---------- */
.ui-dhead{margin-bottom:12px;width:100%;box-sizing:border-box}
.ui-dname{font-size:16px;font-weight:700;color:var(--tx);line-height:1.35}
.ui-did{font-size:11.5px;color:var(--pink2);font-family:var(--mono);margin-top:4px}
.ui-dtabs{display:flex;gap:8px;margin-bottom:10px;width:100%;box-sizing:border-box}
.ui-dtab{flex:1 1 0;min-width:0;padding:9px 0;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid var(--line2);color:var(--tx3);transition:.16s}
.ui-dtab:hover{background:rgba(240,68,148,.14);color:#fff}
.ui-dtab.on{background:rgba(240,68,148,.26);border-color:rgba(240,68,148,.6);color:#fff}
.ui-ddesc{font-size:11.5px;color:var(--tx4);line-height:1.6;margin-bottom:11px;
  width:100%;box-sizing:border-box;white-space:pre-line}
.ui-dcmd{display:flex;gap:9px;align-items:stretch;margin-bottom:12px;
  width:100%;box-sizing:border-box;min-width:0}
.ui-dcmd code{flex:1 1 0;min-width:0;font-family:var(--mono);font-size:12.5px;color:var(--tx2);
  background:rgba(0,0,0,.44);border:1px solid var(--line2);border-radius:9px;
  padding:12px 13px;display:flex;align-items:center;
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;box-sizing:border-box}
.ui-dcopy{padding:0 18px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;
  flex:0 0 auto;background:linear-gradient(135deg,var(--pink),#ff6ba8);color:#fff;
  border:0;box-shadow:0 4px 16px rgba(240,68,148,.32);transition:.16s;white-space:nowrap}
.ui-dcopy:active{transform:scale(.96)}
.ui-dsend{padding:0 18px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;
  flex:0 0 auto;background:rgba(240,68,148,.12);border:1px solid var(--pink);color:var(--pink2);
  transition:.16s;white-space:nowrap}
.ui-dsend:active{transform:scale(.96)}
.ui-dclose{width:100%;box-sizing:border-box;padding:11px 0;border-radius:10px;font-size:13px;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--tx4);transition:.16s}
.ui-dclose:hover{background:rgba(255,255,255,.09);color:var(--tx3)}




.cr-opt{margin:14px 0 8px;font-size:13px;color:var(--tx3)}
.cr-opt label{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.cr-opt b{color:var(--pink2)}
.cr-budget{margin:8px 0 12px;padding:8px 13px;border-radius:8px;font-size:12.5px;
  background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--tx3)}
.cr-budget.ok{background:rgba(52,211,153,.10);border-color:rgba(52,211,153,.40);color:#7ee2b8}
.cr-budget.bad{background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.38);color:#ffa8a8}
.sb-val{min-width:64px;text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--pink2)}




.gl-sets{margin:10px 0 4px;padding:9px 13px;border-radius:8px;font-size:12.5px;
  background:rgba(255,95,162,.08);border:1px solid rgba(255,95,162,.28);color:var(--pink2)}
.gl-wrap{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.gl-row{display:flex;gap:12px;align-items:flex-start;
  background:rgba(255,255,255,.035);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.gl-img{width:44px;height:44px;flex:none;border-radius:8px;object-fit:cover;
  background:rgba(0,0,0,.25);border:1px solid var(--line2)}
.gl-body{flex:1;min-width:0}
.gl-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.gl-name{font-size:13px;font-weight:600;color:var(--pink2);flex:none}
.gl-id{font-family:var(--mono);font-size:11px;color:var(--tx4);flex:none}
.gl-rn{font-size:12px;color:var(--tx3);margin-bottom:6px}
.gl-set{color:var(--tx4);font-size:11.5px}
.gl-copy{margin-left:auto;flex:none;padding:4px 13px;font-size:12px;border-radius:7px;cursor:pointer;
  background:linear-gradient(135deg,#ff5fa2,#c04ad8);color:#fff;border:none;
  font-family:inherit;transition:.18s}
.gl-copy:hover{filter:brightness(1.12)}
.gl-cmd{display:block;font-family:var(--mono);font-size:12px;line-height:1.55;
  color:var(--tx3);background:rgba(0,0,0,.30);border-radius:7px;padding:8px 10px;
  overflow-x:auto;white-space:pre;word-break:normal}
@media(max-width:560px){
  .gl-row{padding:9px 10px;gap:9px}
  .gl-img{width:36px;height:36px}
  .gl-name{font-size:12.5px}
  .gl-cmd{font-size:11px;padding:7px 8px}
}


/* ---- 光锥筛选 ---- */
.lc-filter{display:flex;flex-direction:column;gap:11px;margin-bottom:14px}
.lc-frow{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.lc-flbl{font-size:12px;color:var(--tx3);width:52px;flex-shrink:0;letter-spacing:.5px}
.lc-tabs{display:flex;gap:6px;flex-wrap:wrap}
.lc-tabs button{border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--tx3);
  border-radius:99px;padding:6px 14px;font-size:13px;transition:.18s;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:5px}
.lc-tabs button:hover{border-color:rgba(255,95,162,.42);color:var(--tx2)}
.lc-tabs button.on{background:linear-gradient(135deg,#ff5fa2,#c04ad8);border-color:transparent;
  color:#fff;font-weight:600}
.lc-tabs button i{font-style:normal;font-size:11px;opacity:.72}
.lc-tabs .st{letter-spacing:-1px}
.lc-search{flex:1;min-width:180px;padding:8px 13px;border-radius:8px;font-size:13px;
  background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--tx);font-family:inherit;outline:none}
.lc-search:focus{border-color:rgba(255,95,162,.55)}
.lc-count{font-size:12px;color:var(--tx4);margin-bottom:9px}
.lc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:9px;
  max-height:470px;overflow-y:auto;padding-right:4px}
.lc-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;
  background:rgba(255,255,255,.035);border:1px solid var(--line2);transition:.16s}
.lc-item:hover{border-color:rgba(255,95,162,.42);background:rgba(255,95,162,.06)}
.lc-item.sel{border-color:var(--pink2);background:rgba(255,95,162,.14);
  box-shadow:0 0 0 1px rgba(255,95,162,.42)}
.lc-img{width:38px;height:38px;flex:none;border-radius:6px;object-fit:cover;background:rgba(0,0,0,.25)}
.lc-info{flex:1;min-width:0}
.lc-nm{font-size:12.5px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.lc-mt{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--tx4)}
.lc-st{color:#f5c542;letter-spacing:-1px}
.lc-pth{color:var(--tx3)}
.lc-id{font-family:var(--mono);margin-left:auto}
.lc-empty{grid-column:1/-1;text-align:center;padding:34px;color:var(--tx4);font-size:13px}
@media(max-width:560px){
  .lc-flbl{width:44px;font-size:11.5px}
  .lc-tabs button{padding:5px 11px;font-size:12px}
  .lc-grid{grid-template-columns:1fr;max-height:380px}
  .lc-search{min-width:0}
}
.lc-ico{width:38px;height:38px;flex:none;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:600;color:var(--tx3);
  background:linear-gradient(135deg,rgba(255,95,162,.18),rgba(192,74,216,.14));
  border:1px solid rgba(255,95,162,.22)}
.lc-ico::after{content:attr(data-ch)}

/* ===== 自定义遗器：单件 / 六件套 ===== */
.cr-switch{display:flex;gap:8px;margin-bottom:12px}
.cr-sw{flex:1;padding:11px 0;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--tx3,#aaa);font-size:14px;font-weight:600}
.cr-sw.on{background:linear-gradient(135deg,rgba(255,92,168,.85),rgba(190,70,190,.8));border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(255,92,168,.25)}
.cr-row2{display:flex;gap:10px;margin-bottom:10px}
.cr-row2>.cr-f{flex:1;min-width:0}
.cr-f>label{display:block;font-size:12.5px;color:var(--tx4,#888);margin:0 0 6px 2px}
.cr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}
.cr-cell{padding:7px 8px;border-radius:9px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);cursor:pointer;transition:.15s}
.cr-cell.on{border-color:rgba(240,68,148,.65);background:rgba(240,68,148,.20);box-shadow:0 0 0 1px rgba(240,68,148,.30) inset}
.cr-cell:hover{background:rgba(240,68,148,.12);border-color:rgba(240,68,148,.35)}
.cr-cell-top{font-size:10px;color:var(--tx4,#8a8a8a);margin-bottom:4px}
.cr-rel{display:flex;align-items:center;gap:6px;margin:2px 0 4px}
.cr-img{width:27px;height:27px;border-radius:6px;object-fit:cover;background:rgba(255,255,255,.06);flex:0 0 auto}
.cr-img.ph{opacity:.25}
.cr-ri{min-width:0}
.cr-name{font-size:12.5px;font-weight:700;line-height:1.2;word-break:break-all}
.cr-meta{font-size:10px;color:var(--tx4,#8a8a8a);margin-top:1px}
.cr-star{color:#ffb454;letter-spacing:-1.5px;margin-right:4px;font-size:10px}
.cr-id{font-family:var(--mono,monospace);opacity:.8;font-size:9.5px}
.cr-apply{margin:4px 0 2px}
.cr-apply .btn{width:100%;padding:8px 10px;font-size:12.5px}
.cr-max{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx3,#bbb);padding-top:2px}
.cr-max input{width:auto}
.cr-cell-set{font-size:12px;font-weight:700;color:var(--tx1,#eee);line-height:1.35;min-height:2.7em;overflow:hidden}
.cr-cell-main{font-size:11px;color:var(--pink2,#ff8fc7);margin-top:3px}
.cr-budget{margin:8px 0 10px;font-size:12.5px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.04);color:var(--tx3,#aaa)}
.cr-budget.ok{color:#6ee7b7;background:rgba(60,200,140,.1)}
.cr-budget.bad{color:#ff8a8a;background:rgba(255,90,90,.1)}
@media(max-width:420px){.cr-grid{grid-template-columns:repeat(2,1fr)}}
</style>

const RELIC_PART=['头部','手部','躯干','脚部','位面球','连接绳'];
let RELIC_ICON = {};

/* ===== 遗器卡片选择器 ===== */
function artifactPicker(containerId, opts) {
  opts = opts || {};
  const host = document.getElementById(containerId);
  if (!host) return { get: function(){ return null; }, reset: function(){} };
  let curPart = -1, curRar = -1, curQ = '', selected = null;

  function stars(n){ let x=''; for(let i=0;i<(n||0);i++) x+='★'; return x; }

  function render() {
    const q = curQ.trim().toLowerCase();
    const list = RELIC_DATA.filter(function(r) {
      if (curPart >= 0 && r.p !== curPart) return false;
      if (curRar >= 0 && r.r !== curRar) return false;
      if (!q) return true;
      return r.n.toLowerCase().indexOf(q) >= 0 || (r.e && r.e.toLowerCase().indexOf(q) >= 0) || String(r.i).indexOf(q) >= 0;
    });

    let partBtns = '<button class="rp-f ' + (curPart < 0 ? 'on' : '') + '" data-p="-1">全部</button>';
    for (let i = 0; i < RELIC_PART.length; i++) {
      partBtns += '<button class="rp-f ' + (curPart === i ? 'on' : '') + '" data-p="' + i + '">' + RELIC_PART[i] + '</button>';
    }

    let rarBtns = '<button class="rp-f ' + (curRar < 0 ? 'on' : '') + '" data-r="-1">全部</button>';
    const RARS = [[2,'二星'],[3,'三星'],[4,'四星'],[5,'五星']];
    for (let i = 0; i < RARS.length; i++) {
      rarBtns += '<button class="rp-f ' + (curRar === RARS[i][0] ? 'on' : '') + '" data-r="' + RARS[i][0] + '">' + RARS[i][1] + '</button>';
    }

    let items = '';
    if (list.length) {
      for (let k = 0; k < list.length; k++) {
        const r = list[k];
        const isSel = selected && selected.i === r.i;
        const ic = RELIC_ICON[r.i] || '';
        const img = ic
          ? '<img class="rp-img" src="' + ic + '" alt="" loading="lazy" onerror="this.classList.add(\'ph\')">'
          : '<span class="rp-img ph"></span>';
        items += '<div class="rp-item' + (isSel ? ' sel' : '') + '" data-id="' + r.i + '">' +
          img +
          '<div class="rp-info">' +
            '<div class="rp-name">' + esc(r.n) + '</div>' +
            '<div class="rp-sub"><span class="rp-star">' + stars(r.r) + '</span>' +
              '<span class="rp-part">' + RELIC_PART[r.p] + '</span></div>' +
          '</div>' +
          '<span class="rp-id">#' + r.i + '</span>' +
        '</div>';
      }
    } else {
      items = RELIC_DATA.length
        ? '<div class="rp-empty">没有匹配的遗器</div>'
        : '<div class="rp-empty">relics.json 加载中…</div>';
    }

    host.innerHTML = '<div class="rp-wrap">' +
      '<div class="rp-row"><span class="rp-lbl">部位</span><div class="rp-btns">' + partBtns + '</div></div>' +
      '<div class="rp-row"><span class="rp-lbl">稀有度</span><div class="rp-btns">' + rarBtns + '</div></div>' +
      '<div class="rp-row rp-inline"><span class="rp-lbl">搜索</span><input class="rp-q" id="rpQ" type="text" placeholder="遗器名称或 ID" value="' + esc(curQ) + '"></div>' +
      '<div class="rp-count">共 ' + list.length + ' 个遗器</div>' +

function propSelect(containerId, opts) {
  opts = opts || {};

  if (!host) return { get: function(){ return null; } };
  const items = opts.items || [];
  let curId = opts.value != null ? opts.value : (items[0] ? items[0].id : null);


  function find(id) {
    for (let i = 0; i < items.length; i++) if (items[i].id === id) return items[i];
    return items[0] || null;
  }


  function render() {
    const it = find(curId);
    let optsHtml = '';
    for (let i = 0; i < items.length; i++) {
      const x = items[i];
      optsHtml += '<div class="ps-item ' + (it && x.id === it.id ? 'sel' : '') + '" data-id="' + x.id + '">' + esc(x.cn) + '</div>';

            '<button type="button" class="ps-cur' + (it ? '' : ' ph') + '">' + (it ? esc(it.cn) : esc(opts.placeholder || '请选择')) + '</button>' +
      '<div class="ps-pop" style="display:none">' + optsHtml + '</div>' +
    '</div>';


    const btn = host.querySelector('.ps-cur');
    const pop = host.querySelector('.ps-pop');
    if (btn) btn.onclick = function(e) {
      if (e && e.stopPropagation) e.stopPropagation();

      if (opening) { pop.style.display = 'block'; liftCards(true, host); }
      else { pop.style.display = 'none'; liftCards(false); }
    };

    for (let i = 0; i < els.length; i++) {
      els[i].onclick = (function(el) {

          pop.style.display = 'none';
          render();
          if (opts.onChange) opts.onChange(find(curId));
        };
      })(els[i]);

  render();

/* 枚举下拉：选项少、不需要搜索，键值可以是字符串（materials / cur …） */
function optSelect(hostOrId, opts) {
  opts = opts || {};
  var host = (typeof hostOrId === 'string') ? document.getElementById(hostOrId) : hostOrId;
  if (!host) return { get: function(){ return null; }, set: function(){}, close: function(){} };
  var items = opts.items || [];
  var val = opts.value !== undefined ? opts.value : (items[0] ? items[0].v : null);

  function find(v) {
    for (var i = 0; i < items.length; i++) if (items[i].v === v) return items[i];
    return items[0] || null;
  }

  function closePop() {
    var pop = host.querySelector('.os-pop');
    var btn = host.querySelector('.os-cur');
    if (pop) pop.style.display = 'none';
    if (btn) btn.classList.remove('open');
    liftCards(false);
  }

  function render() {
    var it = find(val);
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var x = items[i];
      var sel = it && x.v === it.v;
      html += '<div class="os-item' + (sel ? ' sel' : '') + '" data-v="' + esc(String(x.v)) + '">' +
        '<span>' + esc(x.n) + '</span>' + (sel ? '<span class="os-tick">✓</span>' : '') + '</div>';
    }
    host.innerHTML = '<div class="os-wrap">' +
      '<button type="button" class="os-cur"><span class="os-tx">' + esc(it ? it.n : (opts.placeholder || '请选择')) + '</span><span class="os-ar">▼</span></button>' +
      '<div class="os-pop" style="display:none">' + html + '</div>' +
    '</div>';

    var btn = host.querySelector('.os-cur');
    var pop = host.querySelector('.os-pop');
    btn.onclick = function(e) {
      e.stopPropagation();
      var open = pop.style.display === 'block';
      liftCards(false);
      document.querySelectorAll('.os-pop').forEach(function(p){ p.style.display = 'none'; });
      document.querySelectorAll('.os-cur').forEach(function(b){ b.classList.remove('open'); });
      if (!open) {
        pop.style.display = 'block';
        btn.classList.add('open');
        /* 卡片用了 backdrop-filter，会形成层叠上下文把下面的卡片盖在弹层上面 —— 打开时把当前卡片提到上层 */
        liftCards(true, host);
        /* 下方空间不够就改向上展开，避免被屏幕底边裁掉 */
        var r = pop.getBoundingClientRect();
        if (r.bottom > window.innerHeight - 8) {
          pop.style.top = 'auto';
          pop.style.bottom = 'calc(100% + 4px)';
        } else {
          pop.style.top = 'calc(100% + 4px)';
          pop.style.bottom = 'auto';
        }
      }
    };
    host.querySelectorAll('.os-item').forEach(function(el) {
      el.onclick = function() {
        val = el.getAttribute('data-v');
        closePop();
        render();
        if (opts.onChange) opts.onChange(find(val));
      };
    });
  }

  render();
  return {
    get: function(){ return find(val); },
    set: function(v){ val = v; render(); },
    setItems: function(list, v){
      items = list || [];
      val = (v !== undefined) ? v : (items[0] ? items[0].v : null);
      render();
    },
    close: closePop
  };
}
/* 打开下拉时把所在卡片提到上层，收起时还原 */
function liftCards(up, host) {
  if (!up) {
    document.querySelectorAll('.card').forEach(function(c){
      if (c.getAttribute('data-lift') === '1') { c.style.zIndex = ''; c.removeAttribute('data-lift'); }
    });
    return;
  }
  var card = host && host.closest ? host.closest('.card') : null;
  if (card) { card.style.position = 'relative'; card.style.zIndex = '25'; card.setAttribute('data-lift', '1'); }
}

  document.addEventListener('click', function(){
    document.querySelectorAll('.os-pop').forEach(function(p){ p.style.display = 'none'; });
    document.querySelectorAll('.os-cur').forEach(function(b){ b.classList.remove('open'); });

  });
}

/* 输入弹窗 */
function uiPrompt(opts){
  return new Promise(function(resolve){
    var o = opts || {};
    var mask = document.createElement('div');
    mask.className = 'ui-mask';
    mask.innerHTML =
      '<div class="ui-modal" role="dialog" aria-modal="true">'+
        '<div class="ui-modal-head">'+
          '<div class="ui-modal-title">'+esc(o.title||'请输入')+'</div>'+
          (o.sub?'<div class="ui-modal-sub">'+esc(o.sub)+'</div>':'')+
        '</div>'+
        '<div class="ui-modal-body">'+
          '<input type="text" class="ui-input" id="__uiInp" '+
            'placeholder="'+esc(o.placeholder||'')+'" '+
            'inputmode="'+(o.inputmode||'text')+'">'+
          '<div class="ui-err" id="__uiErr"></div>'+
        '</div>'+
        '<div class="ui-modal-foot">'+
          '<button class="ui-btn ghost" id="__uiCancel">取消</button>'+
          '<button class="ui-btn primary" id="__uiOk">确定</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(mask);
    requestAnimationFrame(function(){ mask.classList.add('in'); });


    var inp = mask.querySelector('#__uiInp');
    var err = mask.querySelector('#__uiErr');
    setTimeout(function(){ inp.focus(); }, 80);


    function close(val){
      mask.classList.remove('in');
      setTimeout(function(){ mask.remove(); }, 200);
      resolve(val);
    }
    function ok(){
      var v = inp.value.trim();
      if (o.validate){
        var msg = o.validate(v);
        if (msg){ err.textContent = msg; return; }
      }
      close(v);
    }
    function cancel(){ close(null); }


    mask.querySelector('#__uiOk').onclick = ok;
    mask.querySelector('#__uiCancel').onclick = cancel;
    mask.onclick = function(e){ if (e.target === mask) cancel(); };
    inp.onkeydown = function(e){
      if (e.key === 'Enter'){ e.preventDefault(); ok(); }
      else if (e.key === 'Escape'){ e.preventDefault(); cancel(); }
    };
    inp.oninput = function(){ err.textContent = ''; };
  });
}

function uiDrawer(opts){

var AV_DATA=[], AV_MAP={}, AV_READY=false;
function normalizeAv(d){
  var out=[];
  if(Array.isArray(d)){
    d.forEach(function(a,idx){ if(!a) return; out.push({ i:String(a.id||a.i||idx+1), n:String(a.name||a.n||''), p:String(a.icon||a.p||'') }); });
  }else if(d&&typeof d==='object'){
    Object.keys(d).forEach(function(k){ var a=d[k]||{}; out.push({ i:String(a.id||k), n:String(a.name||''), p:String(a.icon||'') }); });
  }
  out=out.filter(function(a){ return a.p; });
  out.sort(function(a,b){ return (parseFloat(a.i)||0)-(parseFloat(b.i)||0); });
  return out;
}
function applyAvData(list){
  if(!list || !list.length) return false;
  AV_DATA=list;
  AV_MAP={}; AV_DATA.forEach(function(a){ AV_MAP[String(a.i)]=a; });
  AV_READY=true;
  paintAcctHead();
  var sh=document.getElementById('avSheet');
  if(sh && sh.classList.contains('on')) renderAvGrid((document.getElementById('avSearch')||{}).value||'');
  return true;
}
function loadAvData(){
  // 先用上次缓存的列表，页面秒开
  try{ var c=localStorage.getItem('yuuki_avatar_list'); if(c) applyAvData(normalizeAv(JSON.parse(c))); }catch(e){}
  // file:// 或 webview 里 fetch 可能被拦，补一个 XHR 读同目录
  if(location.protocol==='file:'){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','avatars.json',true);
      x.onload=function(){
        if(x.status===200||x.status===0){
          try{ var d=JSON.parse(x.responseText); if(applyAvData(normalizeAv(d))) localStorage.setItem('yuuki_avatar_list',JSON.stringify(d)); }catch(e){}
        }
      };
      x.send();
      return;
    }catch(e){}
  }
  var url='avatars.json?t='+Date.now();
  fetch(url,{cache:'no-cache'}).then(function(r){ return r.ok?r.json():Promise.reject(); })
    .then(function(d){
      if(applyAvData(normalizeAv(d))){
        try{ localStorage.setItem('yuuki_avatar_list', JSON.stringify(d)); }catch(e){}
      }
    })
    .catch(function(){
      if(!AV_READY){
        var g=document.getElementById('avGrid');
        if(g) g.innerHTML='<div class="lc-empty">头像数据加载失败：请把 avatars.json 放在页面同目录</div>';
      }
    });
}

/* ===== 数值钳制：按游戏规则把越界输入强制拉回边界（同原客户端行为） ===== */
function clampNum(el){
  if(!el||el.tagName!=='INPUT'||el.type!=='number')return;
  const raw=el.value.trim();
  if(raw==='')return;                      // 允许清空后重输，不打断输入
  let v=parseFloat(raw);
  if(isNaN(v))return;
  const mn=parseFloat(el.getAttribute('min'));
  const mx=parseFloat(el.getAttribute('max'));
  let c=v;
  if(!isNaN(mn)&&c<mn)c=mn;
  if(!isNaN(mx)&&c>mx)c=mx;
  if(c!==v){el.value=c;flashClamp(el);}
}
/* 钳制发生时给一次粉色高亮反馈 */
function flashClamp(el){
  el.classList.remove('clamped');
  void el.offsetWidth;
  el.classList.add('clamped');
  clearTimeout(el._ct);
  el._ct=setTimeout(()=>el.classList.remove('clamped'),420);
}
/* 委托监听：动态渲染的面板同样生效；捕获阶段先于面板自身的 oninput 执行，
   保证面板预览读到的是钳制后的值 */
['input','change','blur'].forEach(ev=>document.addEventListener(ev,e=>{
  const t=e.target;
  if(t&&t.tagName==='INPUT'&&t.type==='number')clampNum(t);
},true));


/* searchable select: renders into container, returns getter */
function sselect(container,{items,placeholder='搜索或选择...',allowId=true,onChange}){
  container.innerHTML='';
  const wrap=document.createElement('div');wrap.className='ss';
  wrap.innerHTML=`<button type="button" class="cur ph">${esc(placeholder)}</button>
    <div class="pop"><input type="text" class="ss-inp" placeholder="输入名称或ID筛选"><div class="lst"></div></div>`;
  container.appendChild(wrap);
  const cur=wrap.querySelector('.cur'),pop=wrap.querySelector('.pop'),inp=wrap.querySelector('input'),lst=wrap.querySelector('.lst');
  let val=null,hl=0;
  function label(it){return it.n?it.n:(allowId?('#'+it.i):'');}
  /* 右侧角标：优先显示 meta（如场景的楼层ID），用于区分同名条目；否则显示 ID */
  function tag(it){
    if(it.meta!==undefined&&it.meta!==null&&it.meta!=='')return String(it.meta);
    if(it.i===undefined||it.i===null)return '';
    /* 只有数字 ID 才显示角标，避免枚举值（materials 之类）露出来 */
    return /^[0-9]+$/.test(String(it.i)) ? String(it.i) : '';
  }
  function set(it){val=it;
    cur.classList.toggle('ph',!it);pop.style.display='none';
    if(!it){cur.innerHTML=esc(placeholder);}
    else{
      const hasMeta=(it.meta!==undefined&&it.meta!==null&&it.meta!=='');
      let html=esc(it.n||'(未命名)');
      if(hasMeta) html+=' <span style="color:var(--pink2);font-family:var(--mono);font-size:12px">'+esc(tag(it))+'</span>';
      else if(it.i!==undefined&&it.i!==null&&/^[0-9]+$/.test(String(it.i))) html+=' <span style="color:var(--tx4);font-family:var(--mono);font-size:12px">#'+esc(String(it.i))+'</span>';
      cur.innerHTML=html;
    }
    if(onChange)onChange(it);}
  function renderList(q){
    q=(q||'').toLowerCase();
    const list=items.filter(it=>!q||String(it.n||'').toLowerCase().includes(q)||
      (it.i!==undefined&&it.i!==null&&String(it.i).includes(q))||
      String(it.meta||'').includes(q)).slice(0,300);
    lst.innerHTML=list.length?list.map((it,i)=>`<div class="it" data-i="${i}"><span>${esc(label(it)||'(未命名)')}</span><span class="id">${esc(tag(it))}</span></div>`).join('')
      :'<div class="empty">未找到匹配项</div>';
    hl=0;
    lst.querySelectorAll('.it').forEach(el=>el.onclick=()=>set(list[+el.dataset.i]));
  }
  cur.onclick=()=>{const open=pop.style.display==='block';pop.style.display=open?'none':'block';
    if(!open){inp.value='';renderList('');inp.focus();
      setTimeout(function(){liftCards(true,wrap);},0);}else{liftCards(false);}};
  inp.oninput=()=>renderList(inp.value);
  inp.onkeydown=e=>{const its=lst.querySelectorAll('.it');
    if(e.key==='ArrowDown'){hl=Math.min(hl+1,its.length-1);}
    else if(e.key==='ArrowUp'){hl=Math.max(hl-1,0);}
    else if(e.key==='Enter'&&its[hl]){set(list_cache[hl]);return;}
    else return;
    its.forEach((x,i)=>x.classList.toggle('hl',i===hl));e.preventDefault();};
  let list_cache=[];
  /* 外层包装需与内层 renderList 的筛选条件保持一致，否则键盘回车会选中错误项 */
  const _r=renderList;renderList=q=>{const list=(q===undefined?[]:items.filter(it=>{q=(q||'').toLowerCase();return !q||String(it.n||'').toLowerCase().includes(q)||((it.i!==undefined&&it.i!==null)&&String(it.i).includes(q))||String(it.meta||'').includes(q);})).slice(0,300);list_cache=list;_r(q);};
  document.addEventListener('click',e=>{if(!wrap.contains(e.target))pop.style.display='none';});
  ssRegistry.push({get:()=>val, set, items});
  return {get:()=>val,set};
}

function saveState(){

function applySnapshot(){
  if(!RESTORE_SNAP)return;
  const inp=RESTORE_SNAP.inputs, ss=RESTORE_SNAP.ss;
  if(inp){
    document.querySelectorAll('#main input, #main select').forEach(i=>{
      if(i.classList&&i.classList.contains('ss-inp'))return;
      if(i.id&&inp[i.id]!==undefined&&i.value!==inp[i.id]){
        i.value=inp[i.id];
        i.dispatchEvent(new Event('input',{bubbles:true}));
        i.dispatchEvent(new Event('change',{bubbles:true}));
      }
    });
  }
  if(ss){
    ss.forEach((id,idx)=>{
      if(id==null||!ssRegistry[idx])return;
      const it=ssRegistry[idx].items.find(x=>String(x.i)===String(id));
      const cur=ssRegistry[idx].get();
      if(it&&(!cur||String(cur.i)!==String(it.i)))ssRegistry[idx].set(it);
    });
  }
}

function csPickIn(m,pk,val,idv){

function findAnchorEl(main, txt){
  if(!txt) return null;
  const all=main.querySelectorAll('h3,.sect,.lbl,button,a,div,span,p');
  let best=null;
  for(let i=0;i<all.length;i++){
    const e=all[i];
    if(e.children && e.children.length) continue;
    if((e.textContent||'').indexOf(txt)<0) continue;
    if(!best || (e.textContent||'').length < (best.textContent||'').length) best=e;
  }
  return best;

function csRender(q){
  const pop=$('#csPop'); if(!pop) return;
  q=(q||'').trim().toLowerCase();
  if(!q){ pop.hidden=true; pop.innerHTML=''; return; }
  const STATIC=[], DATAHITS=[];
  for(let i=0;i<CMD_INDEX.length;i++){
    const it=CMD_INDEX[i];
    if((it.k||'').toLowerCase().indexOf(q)>=0 || (it.n||'').toLowerCase().indexOf(q)>=0){ STATIC.push(i); }
    if(STATIC.length>=6) break;
  }
  const OPTHITS=[];
  for(let i2=0;i2<CS_OPT.length;i2++){
    const o=CS_OPT[i2];
    if(o.n.indexOf(q)>=0 && OPTHITS.length<4) OPTHITS.push(o);
  }
  /* 时装 / 奇缘星魂 卡片名 */
  for(let c=0;c<CS_CARDS.length && DATAHITS.length<6;c++){
    const cf=CS_CARDS[c];
    const arr=cf.get()||[];
    let cnt2=0;
    for(let i=0;i<arr.length;i++){
      const it=arr[i]; if(!it) continue;
      if(String(it[cf.field]||'').toLowerCase().indexOf(q)>=0){
        DATAHITS.push({label:cf.label,p:cf.p,v:it[cf.field],id:it[cf.idf],card:true});
        if(++cnt2>=2 || DATAHITS.length>=6) break;
      }
    }
  }
  const per={};
  for(let s=0;s<CS_DATA.length;s++){
    const cfg=CS_DATA[s];
    const arr=DATA[cfg.key]||[];
    for(let i=0;i<arr.length;i++){
      const it=arr[i]; if(!it) continue;
      const a=String(it[cfg.field]||'').toLowerCase();
      const b=cfg.alt?String(it[cfg.alt]||'').toLowerCase():'';
      if(a.indexOf(q)>=0 || (b&&b.indexOf(q)>=0)){
        const c=per[cfg.key]||0; if(c>=2) break;
        per[cfg.key]=c+1;
        DATAHITS.push({label:cfg.label,p:cfg.p,ph:cfg.ph,sel:cfg.sel,v:it[cfg.field],
          id:(cfg.idf?(it[cfg.idf]!==undefined?it[cfg.idf]:null):null),
          extra:(cfg.alt&&cfg.field!=='title')?String(it[cfg.alt]||''):String(it[cfg.alt]||'')});
        if(DATAHITS.length>=6) break;
      }
    }
    if(DATAHITS.length>=6) break;
  }
  /* 任务名 */
  if(DATAHITS.length<6){
    const QS=csQuests(); let cq=0;
    for(let i=0;i<QS.length;i++){
      const x=QS[i]; if(!x) continue;
      if(String(x.n||'').toLowerCase().indexOf(q)>=0){
        DATAHITS.push({label:'任务',p:'mission',v:x.n,id:x.i,sel:'#miQ',pick:'.mi-qi',kind:x.t==='main'?'主任务':'子任务'});
        if(++cq>=2 || DATAHITS.length>=6) break;
      }
    }
  }
  /* 遗器名（结构特殊的树形数据） */
  if(DATAHITS.length<6 && q.length>=1){
    const rn=csRelicNames(); let cnt=0;
    for(let i=0;i<rn.length;i++){
      if(String(rn[i].n||'').toLowerCase().indexOf(q)>=0){
        DATAHITS.push({label:'遗器',p:'customrelics',sel:'#rpQ',v:rn[i].n,id:rn[i].id,extra:''});
        if(++cnt>=2||DATAHITS.length>=6) break;
      }
    }
  }
  if(!STATIC.length && !DATAHITS.length && !OPTHITS.length){ pop.innerHTML='<div class="cs-empty">没找到，换个关键词试试（可搜指令、物品/角色/场景/怪物名字、下拉类别词）</div>'; pop.hidden=false; return; }
  let html='';
  let firstOpt=-1;
  for(let i3=0;i3<OPTHITS.length;i3++){ if(OPTHITS[i3].n===q){ firstOpt=i3; break; } }
  function optItem(o,j){
    return '<button type="button" class="cs-item" data-t="o" data-i="'+j+'"><span class="k">'+esc(o.n)+'</span>'+esc(o.lab)+'<span class="pg">→ '+esc(csPageName(o.p))+'</span></button>';
  }
  if(firstOpt>=0) html+=optItem(OPTHITS[firstOpt],firstOpt);
  STATIC.forEach(function(i){
    const it=CMD_INDEX[i];
    html+='<button type="button" class="cs-item" data-t="c" data-i="'+i+'"><span class="k">'+esc(it.k)+'</span>'+esc(it.n)+'<span class="pg">→ '+esc(csPageName(it.p))+'</span></button>';
  });
  OPTHITS.forEach(function(o,j){
    if(j===firstOpt) return;
    html+=optItem(o,j);
  });
  DATAHITS.forEach(function(d,j){
    const idt=(d.id!==undefined&&d.id!==null)?' <span class="pg">#'+esc(String(d.id))+'</span>':'';
    const kd=d.kind?' · '+d.kind:'';
    html+='<button type="button" class="cs-item" data-t="d" data-i="'+j+'"><span class="k">'+esc(d.label)+'</span>'+esc(d.v)+idt+'<span class="pg">→ '+esc(csPageName(d.p))+esc(kd)+'</span></button>';
  });
  pop.innerHTML=html;
  pop.hidden=false;
  Array.prototype.forEach.call(pop.querySelectorAll('.cs-item'),function(b){
    b.onmousedown=function(e){
      e.preventDefault();
      if(b.getAttribute('data-t')==='c') gotoIndex(+b.getAttribute('data-i'));
      else if(b.getAttribute('data-t')==='o') gotoOpt(OPTHITS[+b.getAttribute('data-i')]);
      else gotoData(DATAHITS[+b.getAttribute('data-i')]);
    };
  });
  pop._dh=DATAHITS;
}
function initCmdSearch(){
  const inp=$('#cmdSearch'); if(!inp) return;
  inp.oninput=function(){ csRender(inp.value); };
  inp.onkeydown=function(e){
    if(e.key==='Escape'){ const p=$('#csPop'); if(p) p.hidden=true; inp.blur(); }
    if(e.key==='Enter'){
      const first=$('#csPop .cs-item');
      if(first) gotoIndex(+first.getAttribute('data-i'));
    }
  };
  inp.onfocus=function(){ if(inp.value) csRender(inp.value); };
  document.addEventListener('click',function(e){
    const p=$('#csPop');
    if(!p || p.hidden) return;
    const w=document.querySelector('.cs-wrap');
    if(w && w.contains(e.target)) return;
    p.hidden=true;
  });
}

const LC_PATHS=["毁灭","巡猎","智识","同谐","虚无","存护","丰饶","记忆","欢愉"];


/* ===== 光锥：数据读同目录 light_cones.json ===== */
const LC_PATH_IDX = { Warrior:0, Rogue:1, Mage:2, Shaman:3, Warlock:4, Knight:5, Priest:6, Memory:7, Elation:8 };
let LC_DATA = [], LC_LOADING = false;

function applyLightCones(j) {
  var arr = [];
  Object.keys(j).forEach(function(k) {
    var v = j[k];
    var p = LC_PATH_IDX[v.path];
    if (p == null) return;
    var r = +v.rarity;
    if (!(r >= 3 && r <= 5)) r = 3;
    arr.push({ i: +v.id, n: v.name, r: r, p: p, img: v.icon || '' });
  });
  arr.sort(function(a, b) { return (b.r - a.r) || (a.i - b.i); });
  LC_DATA = arr;
}

function loadLightCones(cb) {
  if (LC_DATA.length) { if (cb) cb(); return; }
  if (LC_LOADING) { setTimeout(function() { loadLightCones(cb); }, 300); return; }
  var hadCache = false;
  try {
    var c = localStorage.getItem('yuuki_lc_list');
    if (c) { applyLightCones(JSON.parse(c)); hadCache = LC_DATA.length > 0; }
  } catch (e) {}
  if (hadCache && cb) cb();
  LC_LOADING = true;
  fetch('light_cones.json?t=' + Date.now(), { cache: 'no-cache' })
    .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function(j) {
      var before = LC_DATA.length;
      applyLightCones(j);
      try { localStorage.setItem('yuuki_lc_list', JSON.stringify(j)); } catch (e) {}
      LC_LOADING = false;
      if (cb && LC_DATA.length !== before) cb();
    })
    .catch(function() { LC_LOADING = false; if (cb) cb(); });
}
