    if(mainSel) cmd+=' s'+mainSel.id;
    cmd+=' -sorted lv'+num('lv',15);
    const parts=[];
    for(let i=0;i<subs.length;i++){
      const s=subs[i];
      if(!s.checked || s.id==null) continue;
      parts.push(s.id + ':' + s.count + ':' + num('maxsteps',2));
    }
    if(parts.length) cmd+=' '+parts.join(' ');
    return cmd;
  }


  function upd(){
    // 去重：同一属性只能给一个已勾选的 slot
    (function(){
      const seen = {};
      for(let k=0;k<subs.length;k++){
        const s = subs[k];
        if(!s.checked || s.id==null) continue;
        if(seen[s.id] !== undefined){
          s.checked = false;
          const cbE = document.getElementById('sc'+k); if(cbE) cbE.checked=false;
          const cnE = document.getElementById('scn'+k); if(cnE) cnE.disabled=true;
        } else { seen[s.id] = k; }
      }
    })();
    const bg=$('#budget');
    const bd=calcBudget();
    const maxsteps = ($('#maxsteps')||{}).checked;
    let used=0;
    subs.forEach(function(s){ if(s.checked && s.id!=null) used += s.count; });


    // 每条副属性的实时数值（无论是否勾选都按当前 count 显示）
    subs.forEach(function(s, i){
      const el=$('#sv'+i);
      if(!el) return;
      if(s.id==null || !s.name){ el.textContent=''; return; }
      el.textContent = subValText(s.name, s.base, s.count, maxsteps);
    });


    // 动态刷新每条强化次数上限 = 本条之外剩余可用预算
    subs.forEach(function(s, i){
      const el=document.getElementById('scn'+i);
      if(!el) return;
      let others=0;
      subs.forEach(function(x, k){
        if(k!==i && x.checked && x.id!=null) others += x.count;
      });
      const cap = Math.max(1, 6);
      el.max = cap;
      if(s.checked && s.id!=null && s.count > cap){
        s.count = cap;
        el.value = cap;
      }
    });


    if(bg){
      const ok = bd.n > 0 && used === bd.need;
      const diff = bd.need - used;
      let msg = '强化预算：' + used + ' / ' + bd.need + '\u3000（' + bd.n + ' 条副属性 + lv' + bd.lv + '/' + Math.floor(bd.lv/3) + ' 次强化）';
      if(bd.n === 0) msg += '\u3000先勾选副属性';
      else if(diff > 0) msg += '\u3000还差 ' + diff + ' 点';
      else if(diff < 0) msg += '\u3000超出 ' + (-diff) + ' 点';
      else msg += '\u3000\u2713 已用满';
      bg.className = 'cr-budget ' + (ok ? 'ok' : (bd.n===0 ? '' : 'bad'));
      bg.textContent = msg;
    }


    const pv=$('#pv');
    if(pv) pv.innerHTML = preview(buildCmd());
  }


  $('#lv').oninput = upd;
  $('#maxsteps').oninput = upd;
  $('#maxsteps').onchange = upd;


  rebuildMain();
  rebuildSubs();
  upd();

  /* ================= 完整六件套 ================= */
  const slots=[0,1,2,3,4,5].map(function(){ return { setId:null, relic:null, mainItems:[], mainId:null, subs:[] }; });
  let curPart=0;

  /* ---------- 六件套状态持久化（localStorage） ---------- */
  const SIX_KEY='yuuki_gen_six';
  function loadSixState(){
    try{ const o=JSON.parse(localStorage.getItem(SIX_KEY)||'null'); return (o&&typeof o==='object')?o:null; }catch(e){ return null; }
  }
  const SIX=loadSixState()||{ slots:[], curPart:0, lv:15, max:2, tab:'single', mainCur:0 };
  function saveSixState(){
    try{
      SIX.slots=slots.map(function(sg){
        return { setId:sg.setId||null, mainId:sg.mainId||null,
          subs:(sg.subs||[]).map(function(x){ return { id:x.id, name:x.name, base:x.base, count:x.count, checked:!!x.checked }; }) };
      });
      SIX.curPart=curPart;
      const lvEl=document.getElementById('sixLv'); if(lvEl) SIX.lv=parseInt(lvEl.value,10)||15;
      const mxEl=document.getElementById('sixMax'); if(mxEl) SIX.max=parseInt(mxEl.value,10)||2;
      localStorage.setItem(SIX_KEY, JSON.stringify(SIX));
    }catch(e){}
  }
  function restoreSix(){
    if(!(typeof RELIC_DATA!=='undefined' && RELIC_DATA.length)) return false;
    if(!Object.keys(RELIC_SETS||{}).length) return false;
    (SIX.slots||[]).forEach(function(sv,i){
      if(!sv || !sv.setId || i<0 || i>5) return;
      const sg=slots[i];
      if(!sg.relic || +sg.setId!==+sv.setId){ applySlot(i, sv.setId); }
      if(sv.mainId) sg.mainId=sv.mainId;
      if(sv.subs && sv.subs.length){
        sg.subs=sv.subs.map(function(x){ return { id:x.id, name:x.name, base:x.base, count:x.count||1, checked:!!x.checked }; });
      }
    });
    if(typeof SIX.curPart==='number' && SIX.curPart>=0 && SIX.curPart<6) curPart=SIX.curPart;
    const lvEl=document.getElementById('sixLv');
    if(lvEl && SIX.lv!=null) lvEl.value=SIX.lv;
    const mxEl=document.getElementById('sixMax');
    if(mxEl) mxEl.value=(typeof SIX.max==='number'?SIX.max:2);
    return true;
  }

  // parts 为空=全部套装；传部位数组则只保留有这些部位遗器的套装
  function setItems(parts){
    const all=Object.keys(RELIC_SETS||{}).map(function(k){ return { i:+k, n:RELIC_SETS[k].name }; });
    if(!parts || !parts.length) return all;
    return all.filter(function(x){
      for (let q=0; q<parts.length; q++){ if (findRelic(x.i, parts[q])) return true; }
      return false;
    });
  }
  function findRelic(setId, part){
    for (let k=0;k<RELIC_DATA.length;k++){
      const r=RELIC_DATA[k];
      if (r.set===+setId && r.p===part && r.r===5) return r;
    }
    return null;
  }
  function slotSubs(){
    const DEF=[5,8,9,7];
    return DEF.map(function(id){
      const it=(RELIC_SUB['5']||[]).filter(function(x){ return x.id===id; })[0];
      return { id:it?it.id:null, name:it?it.cn:'', base:it?it.base:0, checked:false, count:1 };
    });
  }
  function applySlot(i, setId){
    const rel=findRelic(setId, i);
    if(!rel) return false;
    const sg=slots[i];
    sg.setId=+setId;
    sg.relic=rel;
    sg.mainItems=(RELIC_MAIN[String(rel.m)]||[]).map(function(x){ return { id:x.id, cn:x.cn, en:x.en, base:x.base }; });
    if(!sg.mainId || !sg.mainItems.some(function(x){ return x.id===sg.mainId; })) sg.mainId=sg.mainItems[0]?sg.mainItems[0].id:null;
    if(!sg.subs.length) sg.subs=slotSubs();
    return true;
  }

  function renderGrid(){
    const g=$('#sixGrid'); if(!g) return;
    if(!setItems().length){ g.innerHTML='<div class="rp-empty">relic_sets.json 加载中…</div>'; return; }
    g.innerHTML=slots.map(function(sg,i){
      const rl=sg.relic||null;
      const ic=rl?(RELIC_ICON[rl.i]||''):'';
      const mitem=(sg.mainItems||[]).filter(function(x){ return x.id===sg.mainId; })[0];
      return '<div class="cr-cell'+(i===curPart?' on':'')+'" data-i="'+i+'">'+
        '<div class="cr-cell-top">0'+(i+1)+' · '+RELIC_PART[i]+'</div>'+
        (rl ? '<div class="cr-rel">'+
                (ic?'<img class="cr-img" src="'+ic+'" alt="" loading="lazy" onerror="this.classList.add(\'ph\')">':'<span class="cr-img ph"></span>')+
                '<div class="cr-ri">'+
                  '<div class="cr-name">'+esc(rl.n)+'</div>'+
                  '<div class="cr-meta"><span class="cr-star">'+new Array(Math.max(1,Math.min(5,rl.r||5))+1).join('★')+'</span><span class="cr-id">#'+rl.i+'</span></div>'+
                '</div>'+
              '</div>'
            : '<div class="cr-cell-set">未设置套装</div>')+
        '<div class="cr-cell-main">'+esc(mitem?mitem.cn:'—')+'</div></div>';
    }).join('');
    g.querySelectorAll('.cr-cell').forEach(function(c){
      c.onclick=function(){ curPart=+c.dataset.i; renderGrid(); renderEditor(); updSet(); };
    });
  }

  function renderEditor(){
    const sg=slots[curPart];
    const t=$('#partTitle'); if(t) t.textContent=RELIC_PART[curPart]+' · 当前编辑部位';
    const host=document.getElementById('setPickHost');
    if(host){
      const ss=sselect(host, { items:setItems([curPart]), placeholder:'选择套装', onChange:function(it){
        if(!it) return;
        if(+it.i===+sg.setId) return;   // 防止回填触发重复渲染
        if(applySlot(curPart,it.i)){ renderGrid(); renderEditor(); updSet(); }
        else toast('该套装没有这个部位的 5 星遗器');
      }});
      if(sg.setId && ss && ss.set){
        const pick=setItems([curPart]).filter(function(x){ return x.i===sg.setId; })[0];
        if(pick && (!ss.get() || ss.get().i!==pick.i)) ss.set(pick);
      }
    }
    propSelect('mainPickHost', { items:sg.mainItems||[], value:sg.mainId, placeholder:'先选套装', onChange:function(it){
      sg.mainId=it.id; renderGrid(); updSet();
    }});
    renderSubs();
  }

  function renderSubs(){
    const host=$('#subsSet'); if(!host) return;
    const sg=slots[curPart];
    if(!sg.subs.length) sg.subs=slotSubs();
    buildSubRows(host, sg.subs, {
      prefix:'set',
      items:(RELIC_SUB['5']||[]),
      onChange:updSet,
      cap:function(){ return 6; }
    });
  }


  function buildSetCmd(){
    const parts=[];
    slots.forEach(function(sg){
      if(!sg.relic) return;
      const subs=(sg.subs||[]).filter(function(x){ return x.checked && x.id!=null; });
      let c='/give '+sg.relic.i;
      if(sg.mainId) c+=' s'+sg.mainId;
      const qv=parseInt((document.getElementById('sixMax')||{}).value,10)||2;
      if(subs.length) c+=' '+subs.map(function(x){ return x.id+':'+x.count+':'+qv; }).join(' ');
      const lvEl=document.getElementById('sixLv');
      const lv=lvEl?(parseInt(lvEl.value,10)||0):15;
      c+=' lv'+(lv>0?lv:15);
      parts.push(c);
    });
    return parts.join(' && ');
  }

  function updSet(){
    const sg=slots[curPart];
    const seen={};
    (sg.subs||[]).forEach(function(x,k){
      if(!x.checked || x.id==null) return;
      if(seen[x.id]!==undefined){
        x.checked=false;
        const c=document.getElementById('setsc'+k); if(c) c.checked=false;
        const n=document.getElementById('setscn'+k); if(n) n.disabled=true;
      } else seen[x.id]=k;
    });
    let used=0, checkedN=0;
    (sg.subs||[]).forEach(function(x){ if(x.checked && x.id!=null){ used+=x.count; checkedN++; } });
    const lvBudget=(function(){ const e=document.getElementById('sixLv'); return e?(parseInt(e.value,10)||0):15; })();
    const need=checkedN+5;
    const bg=$('#budgetSet');
    if(bg){
      bg.className='cr-budget '+(checkedN===0?'':(used===need?'ok':'bad'));
      bg.textContent='强化预算：'+used+' / '+need+'　（'+checkedN+' 条副属性 + lv'+lvBudget+'/5 次强化）　'+
        (checkedN===0?'先勾选副属性':(used===need?'✓ 已用满':(used<need?'还差 '+(need-used)+' 点':'超出 '+(used-need)+' 点')));
    }
    // 每条副属性的实时数值（按当前强化次数显示）
    const maxOn=parseInt((document.getElementById('sixMax')||{}).value,10)||2;
    (sg.subs||[]).forEach(function(x,k){
      const el=document.getElementById('setsv'+k);
      if(!el) return;
      if(x.id==null||!x.name){ el.textContent=''; return; }
      el.textContent=subValText(x.name, x.base, x.count, maxOn);
    });
    saveSixState();
    renderGrid();
    const pv=$('#pvSet'); if(pv) pv.innerHTML=preview(buildSetCmd());
  }

  function bindBulk(){
    const items=setItems();
    const outerItems=setItems([0,1,2,3]);
    const innerItems=setItems([4,5]);
    const oh=document.getElementById('outerSetHost');
    if(oh){
      const os=sselect(oh, { items:outerItems, placeholder:'选外圈套装', onChange:function(it){
        if(!it) return;
        if(outerItems.length && os && os.get && os.get() && +os.get().i===+it.i && [1,2,3].every(function(i){ return +slots[i].setId===+it.i; })) return;
        [0,1,2,3].forEach(function(i){ applySlot(i,it.i); });
        renderGrid(); renderEditor(); updSet();
        toast('外圈四件已设置');
      }});
      const oid=(slots[0].setId && [1,2,3].every(function(i){ return +slots[i].setId===+slots[0].setId; }))?+slots[0].setId:null;
      if(oid && os && os.set){ const pk=outerItems.filter(function(x){ return +x.i===oid; })[0]; if(pk) os.set(pk); }
    }
    const ih=document.getElementById('innerSetHost');
    if(ih){
      const is=sselect(ih, { items:innerItems, placeholder:'选内圈套装', onChange:function(it){
        if(!it) return;
        if(innerItems.length && is && is.get && is.get() && +is.get().i===+it.i && +slots[5].setId===+it.i) return;
        [4,5].forEach(function(i){ applySlot(i,it.i); });
        renderGrid(); renderEditor(); updSet();
        toast('内圈两件已设置');
      }});
      const iid=(slots[4].setId && +slots[5].setId===+slots[4].setId)?+slots[4].setId:null;
      if(iid && is && is.set){ const pk=innerItems.filter(function(x){ return +x.i===iid; })[0]; if(pk) is.set(pk); }
    }
  }

  function showSet(){
    const lvEl=document.getElementById('sixLv');
    if(lvEl && !lvEl.__bound){ lvEl.__bound=1; lvEl.oninput=updSet; lvEl.onchange=updSet; }
    const mxEl=document.getElementById('sixMax');
    if(mxEl && !mxEl.__bound){ mxEl.__bound=1; mxEl.oninput=updSet; mxEl.onchange=updSet; }
    const apBtn=document.getElementById('applySubsAll');
    if(apBtn && !apBtn.__bound){
      apBtn.__bound=1;
      apBtn.onclick=function(){
        const src=(slots[curPart].subs||[]).map(function(x){
          return { id:x.id, name:x.name, base:x.base, count:x.count, checked:!!x.checked };
        });
        slots.forEach(function(sg,i){
          if(i===curPart) return;
          sg.subs=src.map(function(x){ return { id:x.id, name:x.name, base:x.base, count:x.count, checked:!!x.checked }; });
        });
        saveSixState();
        updSet();
        toast('已应用到全部 6 个部位');
      };
    }
    restoreSix();
    bindBulk();
    renderGrid();
    renderEditor();
    updSet();
  }

  $('#crTabSingle').onclick=function(){
    $('#crTabSingle').classList.add('on'); $('#crTabSet').classList.remove('on');
    $('#crSingle').style.display=''; $('#crSet').style.display='none';
    SIX.tab='single'; saveSixState();
  };
  $('#crTabSet').onclick=function(){
    $('#crTabSet').classList.add('on'); $('#crTabSingle').classList.remove('on');
    $('#crSingle').style.display='none'; $('#crSet').style.display='';
    SIX.tab='set';
    showSet();
  };
  // 进入本页时若上次停在六件套，自动切回并恢复
  if(SIX.tab==='set' && $('#crTabSet')){ try{ $('#crTabSet').click(); }catch(e){} }
}


function pGradRelic(el){
  const b=head(el,'毕业遗器','按角色一键获取毕业推荐遗器（含最优主副属性），支持单件或整套。');
  b.innerHTML=`<div class="card">
    ${fld('选择角色','<div id="sel"></div>')}
    ${fld('模式','<div id="modeHost"></div>')}
    <div id="pw" style="display:none">${fld('选择部位','<div id="partHost"></div>')}</div>
    <div id="pv"></div>
    <div id="glist"></div>
  </div>`;
  const g=DATA.graduationrelics;
  const chars=(g.i||[]).map((id,idx)=>({i:id,n:g.n[idx]||('角色'+id),idx}));
  let sel=null;
  sselect($('#sel'),{items:chars,placeholder:'搜索角色...',onChange:it=>{sel=it;fillParts();upd();}});
  function parts(){return sel?(g.v[sel.idx]||[]):[];}
  function partNames(){return sel?(g.t||[]):[];}
  let modeVal='full';
  const modeSel=optSelect($('#modeHost'),{items:[{v:'full',n:'全套遗器（6 条独立命令）'},{v:'single',n:'单件遗器'}],value:'full',onChange:it=>{
    modeVal=it.v;
    $('#pw').style.display=modeVal==='single'?'':'none';
    upd();
  }});
  const partSel=optSelect($('#partHost'),{items:[],placeholder:'选择部位',onChange:()=>upd()});
  function fillParts(){
    const pn=partNames();
    partSel.setItems(pn.map((n,i)=>({v:String(i),n:esc(n||('部位'+(i+1)))})));
  }


  function fullCmd(x){ return x.indexOf('/give ')===0 ? x : '/give '+x; }


  /* 从 RELIC_DATA 取遗器信息 */
  function relicInfo(id){
    if(typeof RELIC_DATA==='undefined') return null;
    for(var k=0;k<RELIC_DATA.length;k++){ if(RELIC_DATA[k].i===id) return RELIC_DATA[k]; }
    return null;
  }
  /* 套装名：中文名去掉「的XXX」尾巴 */
  function setName(n){
    if(!n) return '';
    var p=n.split('的');
    if(p.length>1 && p[0].length>=2) return p[0];
    return n;
  }


  function upd(){
    const listEl=$('#glist');
    if(!sel){ $('#pv').innerHTML=preview(''); if(listEl) listEl.innerHTML=''; return; }
    const ps=parts();
    const pn=partNames();


    if(modeVal==='single'){
      const pIt=partSel.get();
      const idx=pIt?(+pIt.v||0):0;
      $('#pv').innerHTML=preview(ps[idx]?fullCmd(ps[idx]):'');
      if(listEl) listEl.innerHTML='';
      return;
    }


    $('#pv').innerHTML=preview(ps.length?ps.map(fullCmd).join(' && '):'');
    if(!listEl) return;


    /* 统计套装 */
    var sets={};
    for(var i=0;i<ps.length;i++){
      var id0=parseInt(ps[i].split(/\s+/)[0],10);
      var ri=relicInfo(id0);
      if(ri){ var sn=setName(ri.n); sets[sn]=(sets[sn]||0)+1; }
    }
    var setLine=Object.keys(sets).map(function(k){ return k+' ×'+sets[k]; }).join('　+　');


    var h='';
    if(setLine) h+='<div class="gl-sets">套装：'+esc(setLine)+'</div>';
    h+='<div class="sect">按部位复制（6 条独立命令）</div>';
    h+='<div class="gl-wrap">';


    for(var i=0;i<ps.length;i++){
      var cmd=fullCmd(ps[i]);
      var nm=pn[i]||('部位'+(i+1));
      var id=parseInt(ps[i].split(/\s+/)[0],10);
      var ri=relicInfo(id);
      var rname=ri?ri.n:'';
      var sname=ri?setName(ri.n):'';


      h+='<div class="gl-row">';
      h+='<img class="gl-img" src="img/relic/'+id+'.png" alt="" loading="lazy" onerror="this.style.display=&#39;none&#39;">';
      h+='<div class="gl-body">';
      h+='<div class="gl-head"><span class="gl-name">'+esc(nm)+'</span>';
      h+='<span class="gl-id">#'+id+'</span>';
      h+='<button class="gl-copy" data-cmd="'+esc(cmd)+'">复制</button></div>';
      if(rname) h+='<div class="gl-rn">'+esc(rname)+(sname&&sname!==rname?'　<span class="gl-set">'+esc(sname)+'</span>':'')+'</div>';
      h+='<code class="gl-cmd">'+esc(cmd)+'</code>';
      h+='</div>';
      h+='</div>';
    }
    h+='</div>';
    listEl.innerHTML=h;


    [].slice.call(listEl.querySelectorAll('.gl-copy')).forEach(function(btn){
      btn.onclick=function(){ copy(btn.getAttribute('data-cmd'), btn); };
    });
  }
  upd();
}

    <div class="grid3">

  function renderSel(){

function gmToMove(){
  const v=(document.getElementById('gmRep')||{}).value||'';
  const m=v.match(/坐标[^-\d]*(-?\d+)\s*[,，]\s*(-?\d+)\s*[,，]\s*(-?\d+)/);
  if(!m){ toast('这条回复里没找到坐标'); return; }
  [['x',m[1]],['y',m[2]],['z',m[3]]].forEach(function(p){
    const el=document.getElementById(p[0]);
    if(el){ el.value=p[1]; el.dispatchEvent(new Event('input',{bubbles:true})); }
  });
  const box=document.getElementById('gmRep');
  if(box) box.scrollIntoView({block:'center'});
  const mv=document.getElementById('pv3');
  if(mv) mv.scrollIntoView({block:'center'});
  toast('已把坐标填进「位置操作」');
}

    { n:'解锁所有任务', c:'/unlockall mission', d:'解锁全部任务，可直接接取任意任务。' }
  ].forEach(function(x){
    h += '<div class="mi-item">'+
      '<div class="mi-head"><span class="mi-name">'+esc(x.n)+'</span></div>'+
      '<div class="mi-desc">'+esc(x.d)+'</div>'+
      '<div class="mi-cmd"><code>'+esc(x.c)+'</code>'+
        '<button class="mi-copy" data-cmd="'+esc(x.c)+'">复制</button></div>'+
    '</div>';
  });
  h += '</div></div>';



  /* ---------- 命令类型 ---------- */
  h += '<div class="card"><h3>命令类型</h3><div class="mi-tabs" id="miTabs">';
  CMDS.forEach(function(c, i){
    h += '<button class="mi-tab'+(i===0?' on':'')+'" data-cmd="'+c.id+'">'+esc(c.label)+'</button>';
  });
  h += '</div><div class="mi-tip" id="miTip"></div></div>';


  /* ---------- 主体：左列表 + 右命令 ---------- */
  h += '<div class="mi-main"><div class="mi-left"><div class="card">'+
    '<div class="mi-search"><input type="text" id="miQ" placeholder="搜索任务名或 ID…"></div>'+
    '<div class="mi-cats" id="miCats">';
  CATS.forEach(function(c){
    h += '<button class="mi-cat'+(c.k==='all'?' on':'')+'" data-cat="'+c.k+'">'+c.n+'</button>';
  });
  h += '</div><div class="mi-list" id="miList"></div><div class="mi-count" id="miCount"></div>'+
    '</div></div>';


  h += '<div class="mi-right"><div class="card mi-sticky">'+
    '<h3>命令</h3>'+
    '<div class="mi-input"><label>任务 ID</label>'+
      '<input type="text" id="miId" placeholder="点左侧任务自动填入"></div>'+
    '<div id="pv"></div>'+
    '<div class="mi-hint">ⓘ 点左侧任意任务，ID 会自动填入</div>'+
  '</div></div>';


  h += '</div>';
  b.innerHTML = h;


  /* ============================================================
     按 ID 判断主任务 / 子任务
     ============================================================ */
  function typeOfId(v){
    v = (v === undefined || v === null) ? '' : String(v).trim();
    if (!v) return '';
    var idx = window.QIDX || {};
    if (idx[v]) return idx[v];
    if (idx[Number(v)]) return idx[Number(v)];
    if (/^\d{9}$/.test(v)) return 'sub';
    if (/^\d{7}$/.test(v)) return 'main';
    return '';
  }
  function nameOfId(v){
    var arr = window.QUEST || [];
    for (var i = 0; i < arr.length; i++) if (String(arr[i].i) === String(v)) return arr[i].n;
    return '';
  }


  /* ============================================================
     生成命令
     ============================================================ */
  function cmdFor(v, cmdId){
    if (!v) return '';
    if (cmdId === 'finish') return (typeOfId(v) === 'sub' ? '/mission finish ' : '/mission finishmain ') + v;
    return '/mission ' + cmdId + ' ' + v;
  }


  /* ============================================================
     移动端任务抽屉
     ============================================================ */
  function openTaskSheet(id, name, type){
    var drawer = uiDrawer({});
    var sh = drawer.el;


    function paint(cmdId){
      /* 子任务只有「完成任务」可用，其余三个命令只接受主任务 ID */
      var allowed = CMDS.filter(function(c){ return type === 'sub' ? c.id === 'finish' : true; });
      var cli = allowed.filter(function(c){ return c.id === cmdId; })[0] || allowed[0];
      var cmd = cmdFor(String(id), cli.id);


      var tabs = allowed.map(function(c){
        return '<button class="ui-dtab'+(c.id===cli.id?' on':'')+'" data-cmd="'+c.id+'">'+esc(c.label)+'</button>';
      }).join('');


      sh.innerHTML =
        '<div class="ui-dhead">'+
          '<div class="ui-dname">'+esc(name)+'</div>'+
          '<div class="ui-did">'+id+' · '+(type === 'sub' ? '子任务' : '主任务')+'</div>'+
        '</div>'+
        '<div class="ui-dtabs">'+tabs+'</div>'+
        '<div class="ui-ddesc">'+esc(cli.desc)+'</div>'+
        '<div class="ui-dcmd">'+
          '<code>'+esc(cmd)+'</code>'+
          '<button class="ui-dcopy" data-cmd="'+esc(cmd)+'">复制</button>'+
          '<button class="ui-dsend" data-cmd="'+esc(cmd)+'">发送</button>'+
        '</div>'+
        '<button class="ui-dclose">关闭</button>';


      sh.querySelectorAll('.ui-dtab').forEach(function(btn){
        btn.onclick = function(){ paint(btn.dataset.cmd); };
      });
      sh.querySelector('.ui-dcopy').onclick = function(){ copyText(cmd); drawer.close(); };
      var ds = sh.querySelector('.ui-dsend');
      if (ds) ds.onclick = function(){ sendYuuki(cmd); };
      sh.querySelector('.ui-dclose').onclick = function(){ drawer.close(); };
    }


    paint(curCmd);
    drawer.open();
  }


  /* ============================================================
     渲染列表（平铺，最多列 300 条，靠搜索缩小）
     ============================================================ */
  var LIMIT = 300;
  function renderList(){
    var q = curQ.trim().toLowerCase();
    var out = '', shown = 0, total = 0;


    for (var k = 0; k < Q.length; k++){
      var x = Q[k];
      if (curCat !== 'all' && x.t !== curCat) continue;
      if (q && String(x.n).toLowerCase().indexOf(q) < 0 && String(x.i).indexOf(q) < 0) continue;
      total++;
      if (shown >= LIMIT) continue;
      shown++;
      out += '<div class="mi-qi'+(selId === x.i ? ' sel' : '')+'" data-id="'+x.i+'" data-n="'+esc(x.n)+'" data-t="'+x.t+'">'+
        '<span class="mi-qn">'+esc(x.n || ('任务 '+x.i))+'</span>'+
        '<span class="mi-qi2">'+x.i+'</span>'+
        '<span class="mi-qc '+(x.t === 'main' ? 'mc-主线' : 'mc-支线')+'">'+(x.t === 'main' ? '主任务' : '子任务')+'</span>'+
      '</div>';
    }


    if (!total) out = '<div class="mi-empty">'+(Q.length ? '没有匹配的任务' : 'quest.json 加载中…')+'</div>';


    $('#miList').innerHTML = out;
    $('#miCount').textContent = '显示 ' + shown + ' / 共 ' + total + ' 条' + (total > LIMIT ? '（最多列 300 条，用搜索缩小范围）' : '');


    b.querySelectorAll('.mi-qi').forEach(function(el){
      el.onclick = function(){
        selId = parseInt(el.dataset.id, 10);
        selName = el.dataset.n || ('任务 ' + selId);
        selType = el.dataset.t;
        var inp = $('#miId');
        if (inp) { inp.value = String(selId); }
        /* 子任务不能用接取/传送/移除，自动切到「完成任务」 */
        if (selType === 'sub' && curCmd !== 'finish') switchCmd('finish');
        renderList();
        upd();
        el.scrollIntoView({ block:'nearest' });
        if (window.matchMedia && window.matchMedia('(max-width: 980px)').matches){
          openTaskSheet(selId, selName, selType);
        }
      };
    });
  }


  /* ============================================================
     更新命令预览
     ============================================================ */
  function upd(){
    var cli = CMDS.filter(function(c){ return c.id === curCmd; })[0] || CMDS[0];
    var v = (($('#miId') || {}).value || '').trim();
    var t = typeOfId(v);
    var tip = $('#miTip');
    if (tip){
      if (v && cli.kind === 'main' && t === 'sub'){
        tip.innerHTML = '<span style="color:#ff6b8b">⚠</span> ' + esc(v) + ' 是子任务 ID，「' + esc(cli.label) + '」只能填主任务 ID，请改用「完成任务」。';
      } else {
        tip.textContent = cli.desc;
      }
    }
    var pv = $('#pv');
    if (pv) pv.innerHTML = preview(cmdFor(v, curCmd));
  }


  /* ============================================================
     切换命令类型
     ============================================================ */
  function switchCmd(id){
    curCmd = id;
    b.querySelectorAll('#miTabs .mi-tab').forEach(function(x){ x.classList.toggle('on', x.dataset.cmd === id); });
    upd();
  }


  /* ============================================================
     事件绑定
     ============================================================ */
  b.querySelectorAll('#miTabs .mi-tab').forEach(function(btn){
    btn.onclick = function(){ switchCmd(btn.dataset.cmd); };
  });


  b.querySelectorAll('#miCats .mi-cat').forEach(function(btn){
    btn.onclick = function(){
      b.querySelectorAll('#miCats .mi-cat').forEach(function(x){ x.classList.toggle('on', x === btn); });
      curCat = btn.dataset.cat;
      renderList();
    };
  });


  var qInp = $('#miQ');
  if (qInp) qInp.oninput = function(){
    curQ = qInp.value;
    renderList();
    var q2 = $('#miQ');
    if (q2 && q2.focus){ q2.focus(); if (q2.setSelectionRange) q2.setSelectionRange(curQ.length, curQ.length); }
  };


  var idInp = $('#miId');
  if (idInp) idInp.oninput = upd;


  /* 复制 */
  b.querySelectorAll('.mi-copy').forEach(function(btn){
    btn.onclick = function(){
      var c = btn.dataset.cmd;
      if (c === '/unstuck'){
        uiPrompt({
          title: '输入你的 UID',
          sub: '用于生成「脱离卡死」指令，@ 符号会自动保留',
          placeholder: '例如 12345678',
          inputmode: 'numeric',
          validate: function(v){
            if (!v) return 'UID 不能为空';
            if (!/^\d+$/.test(v)) return 'UID 只能包含数字';
            if (v.length < 6 || v.length > 10) return 'UID 长度应为 6~10 位';
            return '';
          }
        }).then(function(uid){
          if (uid === null) return;
          copyText('/unstuck' + uid);
        });
        return;
      }
      copyText(c);
    };
  });


  renderList();
  upd();
}


function pDhCmds(el){
  const b=head(el,'剧情命令中心','常用命令（点击复制/发送）。');
  const list=DATA.dhcommands||[];
  b.innerHTML=`<div class="plist" id="pl"></div>`;
  $('#pl').innerHTML=list.map(c=>`<div class="pitem" onclick="copyText('${esc(c.value).replace(/'/g,"\\'")}')">
    <div class="t">${esc(c.title)}</div><div class="v">${esc(c.value)}</div>
    <div class="d">${esc(c.description||'')}</div></div>`).join('');
}

        }

        cxt.drawImage(img,0,0,25*p.s,30*p.s);cxt.restore();
      }

    })();

function initCursor(){

    inner.classList.toggle('cursor-hover',!!t);

/* 数据加载统一入口：先吃 localStorage 缓存（返回页面 / 断网也能用），再走 fetch，fetch 失败自动 XHR 兜底 */
var __DC_ERR = 0;
function showDataErr(){
  if (__DC_ERR < 3) return;
  if (document.getElementById('dcErrTip')) return;
  var d = document.createElement('div');
  d.id = 'dcErrTip';
  d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:44px;z-index:9998;background:rgba(110,18,38,.94);'+
    'border:1px solid rgba(255,120,150,.55);color:#ffd9e3;font-size:12px;line-height:1.55;padding:10px 12px;border-radius:10px';
  d.innerHTML = '有几个数据文件一直没读进来（已自动重试）。页面会先用上次缓存的内容，确认 json 和 index.html 在同一个目录、并且是直接打开这个页面。';
  document.body.appendChild(d);
  setTimeout(function(){ try{ d.remove(); }catch(e){} }, 9000);
}
function loadJSON(name, onData){
  var KEY = 'yuuki_dc_' + name, lastLen = -1, tries = 0;
  function count(j){
    if (j == null) return 0;
    if (typeof j.length === 'number') return j.length;
    try { return Object.keys(j).length; } catch (e) { return 0; }
  }
  function deliver(j){
    var n = count(j);
    if (n === lastLen) return;            /* 缓存和网络数据条数一样，不重复重绘 */
    lastLen = n;
    try { onData(j); } catch (e) { console.warn(name + ' 处理失败：', e); }
  }
  try {
    var c = localStorage.getItem(KEY);
    if (c) setTimeout(function(){ try { deliver(JSON.parse(c)); } catch (e) {} }, 0);
  } catch (e) {}
  function save(j){ try { localStorage.setItem(KEY, JSON.stringify(j)); } catch (e) {} }
  function viaXHR(){
    try {
      var x = new XMLHttpRequest();
      x.open('GET', name, true);
      x.onload = function(){
        if (x.status === 200 || x.status === 0){
          try { var j = JSON.parse(x.responseText); save(j); deliver(j); } catch (e) {}
        }
      };
      x.onerror = function(){ __DC_ERR++; showDataErr(); };
      x.send();
    } catch (e) { __DC_ERR++; showDataErr(); }
  }
  /* 网络请求失败会自动重试：先转 XHR，再隔 2.5s / 5s 各试一次（返回页面时网络刚恢复常能补上） */
  function net(){
    tries++;
    fetch(name + '?t=' + Date.now(), { cache: 'no-cache' })
      .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function(j){ tries = 99; save(j); deliver(j); })
      .catch(function(){
        if (tries > 3){ __DC_ERR++; showDataErr(); return; }
        if (tries === 1) viaXHR();
        setTimeout(net, 2500 * tries);
      });
  }
  net();
}

<script>
(function(){
  var IMGS={pc:["data:image/jpeg"]}
  var bg=document.getElementById('bg');
  var dots=document.getElementById('bgdots');
  if(!bg||!dots)return;
  var MQ=window.matchMedia('(max-width:760px)');
  var items=[],cur=0,curKind=null,timer=null,DUR=8200;


  function build(kind){
    var list=IMGS[kind]||[];
    if(!list.length)return;
    bg.innerHTML='';
    var sh=document.createElement('div');sh.className='bg-shade';bg.appendChild(sh);
    bg.classList.toggle('landscape', kind==='pc');
    dots.innerHTML='';
    items=list.map(function(src,i){
      var d=document.createElement('div');d.className='bg-slide';
      var bb=document.createElement('div');bb.className='bb';
      bb.style.backgroundImage='url("'+src+'")';
      var bs=document.createElement('div');bs.className='bs';
      bs.style.backgroundImage='url("'+src+'")';
      d.appendChild(bb);d.appendChild(bs);
      bg.appendChild(d);
      var dt=document.createElement('i');dt.title='背景 '+(i+1);
      dots.appendChild(dt);
      return {slide:d,dot:dt};
    });
    cur=0;items[0].slide.classList.add('on');items[0].dot.classList.add('on');
    curKind=kind;
  }
  function go(n){
    if(!items.length)return;
    n=(n+items.length)%items.length;
    if(n===cur)return;
    items[cur].slide.classList.remove('on');items[cur].dot.classList.remove('on');
    items[n].slide.classList.add('on');items[n].dot.classList.add('on');
    cur=n;
  }
  function restart(){ if(timer)clearInterval(timer); timer=setInterval(function(){go(cur+1);},DUR); }
  function pick(){ var kind=MQ.matches?'mob':'pc'; if(kind!==curKind){ build(kind); restart(); } }


  dots.addEventListener('click',function(e){
    var i=Array.prototype.indexOf.call(dots.children,e.target);
    if(i<0)return;
    restart(); go(i);
  });


  build(MQ.matches?'mob':'pc');
  restart();
  var rt=null;
  window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(pick,250); });
  if(MQ.addEventListener)MQ.addEventListener('change',pick);
})();
</script>
